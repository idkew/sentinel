<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Moderation Panel</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f6fb;--surface:#fff;--ink:#121528;--muted:#667085;--line:#e6e9f2;--accent:#2f5bff;--tint:#eaefff;--danger:#e5384f;--ok:#14a44d;--warn:#b7791f;
--display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;--body:'Figtree','Segoe UI',system-ui,sans-serif}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--body)}
h1,h2,h3{font-family:var(--display);margin:0;letter-spacing:-.02em}
button{font:inherit;font-weight:600;border:0;border-radius:10px;padding:9px 15px;cursor:pointer;background:var(--accent);color:#fff;transition:filter .15s}
button:hover{filter:brightness(1.1)}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,nav a:focus-visible{outline:3px solid #9db4ff;outline-offset:2px}
button.ghost{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}button.ghost:hover{background:var(--tint);filter:none}
button.danger{background:var(--danger)}button.sm{padding:6px 11px;font-size:13px}
input,select,textarea{font:inherit;width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
aside{background:var(--surface);border-right:1px solid var(--line);padding:22px 16px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh}
.logo{display:flex;align-items:center;gap:10px;font:700 19px var(--display);padding:0 8px 18px}
.logo i{width:32px;height:32px;border-radius:10px;background:var(--accent);display:grid;place-items:center}.logo svg{stroke:#fff}
nav a{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;color:var(--muted);font-weight:600;cursor:pointer}
nav a:hover{background:var(--bg)}nav a.on{background:var(--tint);color:var(--accent)}
svg.i{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.foot{margin-top:auto;display:grid;gap:10px}.pill{display:flex;align-items:center;gap:8px;background:var(--bg);border-radius:999px;padding:8px 14px;font-size:13px;font-weight:600}
.dot{width:9px;height:9px;border-radius:50%;background:#b9bfce}.dot.on{background:var(--ok);box-shadow:0 0 0 4px #14a44d26}
main{padding:34px 40px;min-width:0;max-width:1100px}
header{margin-bottom:24px}header h1{font-size:34px}header p{margin:2px 0 0;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px}
.grid{display:grid;gap:16px}.g2{grid-template-columns:1.6fr 1fr}.g3{grid-template-columns:1fr 1fr}.mt{margin-top:16px}
.hero{background:var(--tint);border-color:#d8e0ff}.lbl{color:var(--muted);font-weight:600;font-size:14px}.big{font:700 68px/1 var(--display);margin:6px 0 10px;letter-spacing:-.04em}
.spark{width:100%;height:90px;display:block}.tiles{display:grid;grid-template-columns:1fr 1fr;gap:16px}.tile b{display:block;font:700 32px/1.1 var(--display)}.tile span{color:var(--muted);font-size:13px;font-weight:600}
.muted{color:var(--muted)}.empty{color:var(--muted);padding:22px 0;text-align:center}
.feed{list-style:none;margin:10px 0 0;padding:0}.feed li{display:flex;gap:12px;padding:9px 0;border-top:1px solid var(--line);font-size:14px}.feed time{color:var(--muted);min-width:58px}
.players{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}
.pc{display:grid;gap:14px}.who{display:flex;gap:12px;align-items:center}.who b{display:block;line-height:1.2}.who small{color:var(--muted)}
.av{width:48px;height:48px;border-radius:14px;background:var(--tint);color:var(--accent);display:grid;place-items:center;font:700 19px var(--display);object-fit:cover;flex-shrink:0}
.acts{display:flex;gap:6px;flex-wrap:wrap}.tag{font-size:12px;font-weight:700;border-radius:999px;padding:2px 9px;margin-left:6px;background:#fdeaec;color:var(--danger)}.tag.m{background:#fdf2dc;color:var(--warn)}
.search{display:flex;gap:10px;max-width:560px}.search input{padding:14px 18px;border-radius:14px;font-size:16px}.search button{padding:0 24px;border-radius:14px}
.prof{display:flex;gap:18px;align-items:center;flex-wrap:wrap}.prof .av{width:84px;height:84px;border-radius:20px;font-size:32px}.prof h2{font-size:26px}
table{width:100%;border-collapse:collapse}th{text-align:left;color:var(--muted);font-size:13px;font-weight:600}td,th{padding:11px 8px;border-top:1px solid var(--line)}th{border-top:0}
.ty{font-weight:700}.ty.Banned,.ty.Suspended,.ty.Kicked{color:var(--danger)}.ty.Warned,.ty.Muted{color:var(--warn)}
dialog{border:0;border-radius:18px;padding:26px;width:min(440px,92vw);box-shadow:0 24px 70px #121528547;color:var(--ink)}dialog::backdrop{background:#121528aa}
dialog h2{font-size:22px;margin-bottom:14px}dialog label{display:block;font-weight:600;font-size:14px;margin:12px 0 5px}.row{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 20px;border-radius:12px;font-weight:600;z-index:9}
#login{min-height:100vh;display:grid;place-items:center;padding:20px}#login .card{width:min(380px,100%);padding:32px;display:grid;gap:14px}#login .logo{padding:0}.err{color:var(--danger);font-size:14px;min-height:20px}
.bar{height:8px;background:var(--bg);border-radius:99px;overflow:hidden;min-width:110px}.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}.bar.done i{background:var(--ok)}
.sw{display:flex;align-items:center;gap:8px;font-weight:600;cursor:pointer}.sw input{width:auto;accent-color:var(--accent)}.rule{display:grid;gap:12px}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:12px}.fields label{display:block;font-size:13px;color:var(--muted);font-weight:600;margin-bottom:4px}.ty.Points{color:var(--ok)}
.me{font-size:13px;color:var(--muted);padding:0 4px}
.legal{display:flex;gap:14px;font-size:13px;justify-content:center;flex-wrap:wrap}.legal a{color:var(--muted)}
.steps{display:grid;gap:12px}.step{background:var(--bg);border-radius:12px;padding:14px 16px}.btnlink{display:inline-block;background:#fff;color:var(--ink);box-shadow:inset 0 0 0 1px var(--line);border-radius:10px;padding:9px 15px;font-weight:600;text-decoration:none}.btnlink:hover{background:var(--tint)}
.checks{list-style:none;padding:0;margin:10px 0 0;display:grid;gap:8px}.checks .ok{color:var(--ok);font-weight:700}.checks a{color:var(--accent)}
.badge{margin-left:auto;background:var(--danger);color:#fff;font-size:12px;font-weight:700;border-radius:999px;padding:1px 8px}
.callh{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.callh h3{font-size:18px}
.st{font-size:12px;font-weight:700;border-radius:999px;padding:2px 10px;background:#fdf2dc;color:var(--warn)}.st.claimed{background:var(--tint);color:var(--accent)}.st.resolved{background:#e3f6ea;color:var(--ok)}
.snap{background:var(--bg);border-radius:12px;padding:10px 14px;margin:6px 0 12px;max-height:190px;overflow:auto;font-size:14px}.snap div{padding:2px 0}.snap b{margin-right:6px}
.fl{background:#fdf2dc;border-radius:6px;padding:0 4px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 0}.chip{background:var(--tint);color:var(--accent);border-radius:999px;padding:3px 5px 3px 12px;font-weight:600;font-size:13px;display:flex;gap:4px;align-items:center}.chip button{padding:0 7px;background:none;color:var(--accent);font-size:17px;line-height:1.3}
.cl{list-style:none;margin:12px 0 0;padding:0}.cl li{display:flex;gap:10px;align-items:baseline;padding:7px 0;border-top:1px solid var(--line);font-size:14px}.cl time{color:var(--muted);min-width:56px}.cl .tx{flex:1;word-break:break-word}.cl .a{display:flex;gap:4px;visibility:hidden}.cl li:hover .a,.cl li:focus-within .a{visibility:visible}
.sess{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.person{background:#fff;border-radius:999px;padding:4px 12px;font-size:13px;font-weight:600}
@media(max-width:820px){.app{grid-template-columns:1fr}aside{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center}.logo{padding:0}.foot{display:none}main{padding:22px 16px}.g2,.g3{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<div id="login" hidden><form class="card" id="lf"><div class="logo"><i><svg class="i" viewBox="0 0 24 24"><path d="M12 3l8 3v6c0 4.5-3.2 8-8 9-4.8-1-8-4.5-8-9V6z"/></svg></i>Moderation Panel</div>
<label class="muted" for="un">Username</label><input id="un" value="owner" autocomplete="username" required><label class="muted" for="pw">Password</label><input id="pw" type="password" autocomplete="current-password" required><div class="err" id="le"></div><button>Sign in</button><div class="legal"><a href="/legal/privacy">Privacy</a><a href="/legal/terms">Terms</a><a href="/legal/cookies">Cookies</a></div></form></div>
<div class="app" id="app" hidden>
<aside><div class="logo"><i><svg class="i" viewBox="0 0 24 24"><path d="M12 3l8 3v6c0 4.5-3.2 8-8 9-4.8-1-8-4.5-8-9V6z"/></svg></i>Moderation</div>
<nav id="nav"></nav>
<div class="foot"><div class="me" id="me"></div><div class="pill"><span class="dot" id="dot"></span><span id="st">Waiting for game</span></div><div class="legal"><a href="/legal/privacy" target="_blank">Privacy</a><a href="/legal/terms" target="_blank">Terms</a><a href="/legal/cookies" target="_blank">Cookies</a></div><button class="ghost sm" id="out">Sign out</button></div></aside>
<main><header><h1 id="title"></h1><p id="sub" class="muted"></p></header><section id="view"></section></main></div>
<dialog id="dlg"><h2 id="dt"></h2><div id="dd"></div><div class="row"><button class="ghost" id="dc">Cancel</button><button id="dok">Confirm</button></div></dialog>
<div id="toast" hidden></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const I={home:'<path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',users:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 3-6 6.5-6s6.5 2.4 6.5 6"/><circle cx="17" cy="9" r="2.5"/><path d="M17 14c2.7 0 4.5 1.8 4.5 4.5"/>',search:'<circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>',ban:'<circle cx="12" cy="12" r="9"/><path d="M5.6 5.6l12.8 12.8"/>',cal:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',bell:'<path d="M6 9a6 6 0 0 1 12 0c0 6 2 7 2 7H4s2-1 2-7"/><path d="M10 20a2 2 0 0 0 4 0"/>',chat:'<path d="M4 5h16v11H9l-5 4z"/>',trend:'<path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/>',bolt:'<path d="M13 2L4 14h7l-1 8 9-12h-7z"/>',plug:'<path d="M9 2v6M15 2v6M6 8h12v4a6 6 0 0 1-12 0z"/><path d="M12 18v4"/>',shield:'<path d="M12 3l8 3v6c0 4.5-3.2 8-8 9-4.8-1-8-4.5-8-9V6z"/>'};
const PAGES={overview:['Overview','What is happening in your game right now','home'],setup:['Connect your game','Install the script and check the connection','plug',3],players:['Live players','Everyone in your game, across all servers','users'],lookup:['Player lookup','Find any Roblox user and review their history','search'],calls:['ModCalls','Reports sent by players, with the chat that led up to them','bell'],sessions:['Sessions','Run trainings and events with attendance','cal'],chat:['Chat monitor','Live chat from every server, with flagged words','chat'],activity:['Activity','Playtime, weekly quota and points','trend'],rules:['Automations','Rules that run on their own','bolt',3],staff:['Staff','Moderator accounts, roles, and an audit log of everything they did','shield',3],bans:['Bans and mutes','Everyone currently restricted','ban']};
let S={players:[],bans:[],mutes:[],feed:[],history:[],stats:{},session:null,sessions:[],calls:[],chat:[],flagWords:[],openCalls:0,me:null,board:[],settings:{quotaMinutes:60},rules:{},staff:[],audit:[]},page='overview',found=null,AV={};
const api=async(p,o)=>{const r=await fetch(p,o);if(r.status===401){login(true);throw 0}return r.json()};
const RANK={helper:1,moderator:2,admin:3},can=n=>!S.me||RANK[S.me.role]>=n;
const ago=t=>{const s=Math.floor((Date.now()-t)/1000);return s<60?s+'s ago':s<3600?Math.floor(s/60)+'m ago':Math.floor(s/3600)+'h ago'};
const until=e=>e?new Date(e).toLocaleString([], {month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}):'Permanent';
const av=(id,n)=>AV[id]?`<img class="av" src="${esc(AV[id])}" alt="">`:`<div class="av">${esc((n||'?')[0].toUpperCase())}</div>`;
const tile=(n,l)=>`<div class="card tile"><b>${n||0}</b><span>${l}</span></div>`;
const toast=t=>{const e=$('#toast');e.textContent=t;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>e.hidden=true,2600)};
const btn=(a,u,l,c='ghost sm')=>`<button class="${c}" data-a="${a}" data-id="${u.userId}" data-n="${esc(u.name)}">${l}</button>`;
const acts=u=>`<div class="acts">${btn('warn',u,'Warn')}${btn('kick',u,'Kick')}${can(2)?btn('mute',u,'Mute')+btn('ban',u,'Ban','danger sm'):''}</div>`;

function spark(){const h=S.history||[];if(h.length<2)return '<p class="muted">Collecting player history...</p>';
 const m=Math.max(...h.map(p=>p.n),1),W=400,H=90,pts=h.map((p,i)=>(i/(h.length-1)*W).toFixed(1)+','+(H-5-p.n/m*(H-16)).toFixed(1)).join(' ');
 return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><polygon points="0,${H} ${pts} ${W},${H}" fill="#2f5bff" opacity=".14"/><polyline points="${pts}" fill="none" stroke="#2f5bff" stroke-width="2.5" vector-effect="non-scaling-stroke" stroke-linejoin="round"/></svg>`}
const feedHTML=()=>S.feed.length?`<ul class="feed">${S.feed.slice(0,8).map(f=>`<li><time>${ago(f.t)}</time><span>${esc(f.text)}</span></li>`).join('')}</ul>`:'<div class="empty">Nothing yet. Join your game to see activity here.</div>';

const RM={autosuspend:['Auto-suspend after repeated warnings','Suspends a player once they collect enough warnings in a row.',{warns:'Warnings before suspension',minutes:'Suspension length (minutes)'}],sessionpoints:['Points for attending sessions','Awards points to everyone marked present when a session ends.',{points:'Points per attendee'}],flaggedmute:['Auto-mute for flagged chat','Mutes a player who keeps using flagged words.',{count:'Flagged messages before mute',minutes:'Mute length (minutes)'}],welcome:['Welcome message','Shows a banner to each player when they join.',{text:'Message'}]};
let SK=null;
const VIEWS={
 overview:()=>`${S.session?`<div class="card" style="margin-bottom:16px;display:flex;align-items:center;gap:12px"><span class="dot on"></span><b>${esc(S.session.type)} is running</b><span class="muted">${S.session.attendees.length} present</span><button class="ghost sm" data-p="sessions" style="margin-left:auto">Open</button></div>`:''}<div class="grid g2"><div class="card hero"><div class="lbl">Players online</div><div class="big">${S.players.length}</div>${spark()}<p class="muted" style="margin:8px 0 0;font-size:13px">Peak this session: ${S.stats.peak||0}</p></div>
  <div class="tiles">${tile(S.stats.activeBans,'Active bans')}${tile(S.stats.activeMutes,'Active mutes')}${tile(S.openCalls,'Open ModCalls')}${tile(S.stats.kicks,'Kicks')}</div></div>
  <div class="grid g3 mt"><div class="card"><h3>Announce to all servers</h3><p class="muted" style="margin:4px 0 12px">Shows a banner to every player in your game.</p><input id="ann" maxlength="200" placeholder="Server restarting in 5 minutes"><div class="row"><button id="annb">Send announcement</button></div></div>
  <div class="card"><h3>Recent activity</h3>${feedHTML()}</div></div>`,
 players:()=>S.players.length?`<div class="players">${S.players.map(p=>`<div class="card pc"><div class="who">${av(p.userId,p.name)}<div><b>${esc(p.displayName||p.name)}${S.mutes.some(m=>m.userId==p.userId)?'<span class="tag m">Muted</span>':''}</b><small>@${esc(p.name)} on server ${esc(p.server)}</small></div></div>${acts({userId:p.userId,name:p.name})}</div>`).join('')}</div>`:`<div class="card empty">${S.connected?'No one is in your game right now.':'Your game is not connected. Start it with MockPanelBridge running, then this fills in.'}</div>`,
 lookup:()=>`<form class="search" id="sf"><input id="q" placeholder="Roblox username" autocomplete="off"><button>Search</button></form><div id="res" class="mt"></div>`,
 sessions:()=>{const s=S.session;
  const top=s?`<div class="card hero"><div class="lbl">Running now, started ${ago(s.start)}</div><h2 style="font-size:30px;margin:4px 0">${esc(s.type)}</h2>${s.notes?`<p class="muted" style="margin:0">${esc(s.notes)}</p>`:''}<div class="big" style="font-size:52px">${s.attendees.length} <span class="muted" style="font:600 18px var(--body)">present</span></div><div class="sess">${s.attendees.map(a=>`<span class="person">${esc(a.name)}</span>`).join('')||'<span class="muted">No one yet. Players type !attend in chat.</span>'}</div><div class="row" style="justify-content:flex-start"><button class="ghost" data-s="addall">Add everyone in game</button><button class="danger" data-s="end">End session</button></div></div>`
  :`<div class="card"><h3>Start a session</h3><div class="grid g3 mt"><div><label class="lbl" for="stype">Type</label><select id="stype"><option>Training</option><option>Shift</option><option>Event</option><option>Meeting</option></select></div><div><label class="lbl" for="snote">Notes (optional)</label><input id="snote" maxlength="200" placeholder="Topic or location"></div></div><div class="row" style="justify-content:space-between;align-items:center"><span class="muted">Players get a banner, then type !attend in chat to be marked present.</span><button data-s="start">Start session</button></div></div>`;
  const hist=S.sessions.length?`<table><tr><th>Type</th><th>Date</th><th>Length</th><th>Present</th></tr>${S.sessions.map(x=>`<tr><td><b>${esc(x.type)}</b></td><td>${new Date(x.start).toLocaleString([],{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})}</td><td>${dur(x.end-x.start)}</td><td title="${esc(x.attendees.map(a=>a.name).join(', '))}">${x.attendees.length}</td></tr>`).join('')}</table>`:'<div class="empty">No past sessions yet.</div>';
  return top+`<div class="card mt"><h3>History</h3>${hist}</div>`},
 calls:()=>{if(!S.calls.length)return '<div class="card empty">No ModCalls yet. Players send one by typing !modcall and a short message in chat.</div>';
  return S.calls.map(c=>{const who=[...new Map(c.chat.filter(m=>m.userId!==c.from.userId).map(m=>[m.userId,m.name]))].slice(0,4);
   return `<div class="card" style="margin-bottom:16px"><div class="callh"><h3>#${c.id} from ${esc(c.from.name)}</h3><span class="st ${c.status}">${c.status}</span><span class="muted" style="margin-left:auto">${ago(c.t)}, server ${esc(c.server)}</span></div><p style="margin:10px 0 14px;font-size:16px">${esc(c.text)}</p>
   <div class="lbl">Chat before the report</div><div class="snap">${c.chat.map(m=>`<div><b>${esc(m.name)}</b><span class="${m.flagged?'fl':''}">${esc(m.text)}</span></div>`).join('')||'<span class="muted">No chat captured.</span>'}</div>
   ${who.length&&c.status!=='resolved'?`<div class="lbl">Act on someone from this chat</div>${who.map(([id,n])=>`<div class="who" style="margin:6px 0;justify-content:space-between"><b>${esc(n)}</b>${acts({userId:id,name:n})}</div>`).join('')}`:''}
   ${c.note?`<p class="muted">Resolution: ${esc(c.note)}</p>`:''}
   <div class="row" style="justify-content:flex-start">${c.status==='open'?`<button data-call="${c.id}" data-op="claim">Claim</button>`:''}${c.status!=='resolved'?`<button class="ghost" data-call="${c.id}" data-op="resolve">Resolve</button>`:''}</div></div>`}).join('')},
 chat:()=>`<div class="card"><h3>Flagged words</h3><p class="muted" style="margin:4px 0 0">Messages containing these are highlighted and added to Recent activity.</p><div class="chips">${S.flagWords.map(w=>`<span class="chip">${esc(w)}<button data-fw="${esc(w)}" aria-label="Remove ${esc(w)}">&times;</button></span>`).join('')}</div><form class="search mt" id="fwf" style="max-width:380px"><input id="fw" maxlength="30" placeholder="Add a word or phrase"><button class="ghost">Add</button></form></div>
  <div class="card mt"><h3>Live chat</h3>${S.chat.length?`<ul class="cl">${S.chat.map(c=>`<li><time>${ago(c.t)}</time><span class="tx"><b>${esc(c.name)}</b> <span class="${c.flagged?'fl':''}">${esc(c.text)}</span></span><span class="a">${btn('warn',{userId:c.userId,name:c.name},'Warn')}${btn('mute',{userId:c.userId,name:c.name},'Mute')}</span></li>`).join('')}</ul>`:'<div class="empty">No chat yet. Messages from your game appear here live.</div>'}</div>`,
 setup:()=>{const L=(SK&&SK.legal)||{},chk=(ok,t)=>`<li><span class="${ok?'ok':'muted'}">${ok?'&#10003;':'&#9675;'}</span> ${t}</li>`;
  return `<div class="card"><h3>Install in your game</h3><p class="muted" style="margin:4px 0 14px">Three steps. The script already contains your panel address and game key.</p><div class="steps">
   <div class="step"><b>1. Add the script.</b> In Roblox Studio, insert a <b>Script</b> into <b>ServerScriptService</b> and paste the code in, or download the file and drag it in.<div class="row" style="justify-content:flex-start;margin:10px 0 0"><button data-setup="copy">Copy script</button><a class="btnlink" href="/api/bridge?download=1">Download .lua</a></div></div>
   <div class="step"><b>2. Allow HTTP requests.</b> In Game Settings, open Security and switch on <b>Allow HTTP Requests</b>. This script does not need LoadstringEnabled.</div>
   <div class="step"><b>3. Run your game.</b> Press Play in Studio or open a live server. This page updates by itself.<div class="callh" style="margin-top:10px"><span class="dot${S.connected?' on':''}"></span><b>${S.connected?`Connected, ${S.servers} server${S.servers>1?'s':''}`:'Waiting for your game...'}</b></div></div></div></div>
  <div class="grid g3 mt"><div class="card"><h3>Game key</h3><p class="muted" style="margin:4px 0 12px">Treat it like a password. Anyone who has it can send moderation commands to your game.</p><div class="search"><input id="gk" type="password" readonly value="${SK?esc(SK.gameKey):''}" aria-label="Game key"><button class="ghost" data-setup="reveal">Show</button><button class="ghost" data-setup="copykey">Copy</button></div></div>
  <div class="card"><h3>What players can type</h3><table><tr><td><code>!modcall your message</code></td><td>Report a problem to moderators</td></tr><tr><td><code>!attend</code></td><td>Mark yourself present in a session</td></tr></table></div></div>
  <div class="card mt"><h3>Before you go live</h3><ul class="checks">${chk(L.company&&L.email&&L.country,'Set <b>PANEL_COMPANY</b>, <b>PANEL_EMAIL</b> and <b>PANEL_COUNTRY</b> in your Vercel environment variables, then redeploy')}${chk(L.reviewed,'Have a lawyer review the policies, then set <b>LEGAL_REVIEWED</b> to true in Vercel')}${chk(false,'Show players the <a href="/legal/player-notice" target="_blank">Player Notice</a> somewhere in your game')}${chk(false,'Check Roblox\'s current rules for sending player data outside Roblox')}</ul>
   <p class="muted" style="margin:12px 0 0">Your policies: <a href="/legal/privacy" target="_blank">Privacy</a>, <a href="/legal/terms" target="_blank">Terms</a>, <a href="/legal/cookies" target="_blank">Cookies</a>, <a href="/legal/acceptable-use" target="_blank">Acceptable Use</a>, <a href="/legal/player-notice" target="_blank">Player Notice</a>.</p></div>`},
 activity:()=>{const q=S.settings.quotaMinutes;
  return `<div class="card"><div class="callh"><h3>Weekly quota</h3><span class="muted">Minutes played in your game this week. Resets every Monday (UTC).</span></div>${can(3)?`<div class="search mt" style="max-width:380px"><input id="qm" type="number" min="1" value="${q}" aria-label="Quota in minutes"><button class="ghost" data-quota>Save</button></div>`:`<p style="margin:10px 0 0"><b>${q} minutes</b> per week</p>`}</div>
  <div class="card mt"><h3>Leaderboard</h3>${S.board.length?`<table><tr><th>#</th><th>Player</th><th>This week</th><th>Quota</th><th>Total</th><th>Points</th><th></th></tr>${S.board.map((p,i)=>{const m=Math.floor(p.week/60),pct=Math.min(100,Math.round(m/q*100));return `<tr><td>${i+1}</td><td><b>${esc(p.name)}</b></td><td>${m} min</td><td><div class="bar${pct>=100?' done':''}"><i style="width:${pct}%"></i></div></td><td>${dur(p.total*1000)}</td><td><b>${p.points}</b></td><td>${can(2)?btn('points',p,'Points'):''}</td></tr>`}).join('')}</table>`:'<div class="empty">Nobody tracked yet. Playtime is recorded automatically while players are in your game.</div>'}</div>`},
 rules:()=>Object.entries(RM).map(([id,[t,d,f]])=>{const r=S.rules[id]||{};return `<div class="card rule" data-rule="${id}" style="margin-bottom:16px"><div class="callh"><h3>${t}</h3><label class="sw" style="margin-left:auto"><input type="checkbox" data-en ${r.enabled?'checked':''}>Enabled</label></div><p class="muted" style="margin:0">${d}</p><div class="fields">${Object.entries(f).map(([k,l])=>`<div><label for="${id}-${k}">${l}</label><input id="${id}-${k}" data-k="${k}" ${typeof r[k]==='number'?'type="number" min="1"':'maxlength="120"'} value="${esc(r[k])}"></div>`).join('')}</div><div class="row" style="justify-content:flex-start;margin:0"><button data-rule-save="${id}">Save</button></div></div>`}).join(''),
 staff:()=>`<div class="card"><h3>Staff accounts</h3><table><tr><th>Username</th><th>Role</th><th></th></tr><tr><td><b>owner</b></td><td>admin</td><td class="muted">Main account</td></tr>${S.staff.map(s=>`<tr><td><b>${esc(s.username)}</b></td><td><select data-rolefor="${esc(s.username)}" style="width:auto;padding:6px 10px">${['helper','moderator','admin'].map(r=>`<option${r===s.role?' selected':''}>${r}</option>`).join('')}</select></td><td><button class="ghost sm" data-staff="setrole" data-user="${esc(s.username)}">Save role</button> <button class="ghost sm" data-staff="remove" data-user="${esc(s.username)}">Remove</button></td></tr>`).join('')}</table>
  <h3 style="margin-top:24px">Add a moderator</h3><div class="fields"><div><label for="su">Username</label><input id="su" maxlength="20" autocomplete="off"></div><div><label for="sp">Password (8+ characters)</label><input id="sp" type="password" autocomplete="new-password"></div><div><label for="sr">Role</label><select id="sr"><option>helper</option><option selected>moderator</option><option>admin</option></select></div></div>
  <div class="row" style="justify-content:flex-start"><button data-staff="add">Add staff member</button></div>
  <p class="muted" style="margin:0"><b>Helper:</b> warn, kick, ModCalls, sessions. <b>Moderator:</b> also mute, timed bans, points, flagged words and announcements. <b>Admin:</b> everything, including permanent bans, unbans, automations and staff.</p></div>
  <div class="card mt"><h3>Audit log</h3>${S.audit.length?`<table><tr><th>When</th><th>Who</th><th>What</th></tr>${S.audit.map(a=>`<tr><td>${ago(a.t)}</td><td><b>${esc(a.user)}</b></td><td>${esc(a.text)}</td></tr>`).join('')}</table>`:'<div class="empty">No actions recorded yet.</div>'}</div>`,
 bans:()=>`<div class="card"><h3>Banned</h3>${S.bans.length?`<table><tr><th>Player</th><th>Reason</th><th>Ends</th><th></th></tr>${S.bans.map(b=>`<tr><td><b>${esc(b.name)}</b></td><td>${esc(b.reason)}</td><td>${until(b.expires)}</td><td>${can(3)?btn('unban',b,'Unban'):''}</td></tr>`).join('')}</table>`:'<div class="empty">No one is banned.</div>'}</div>
  <div class="card mt"><h3>Muted</h3>${S.mutes.length?`<table><tr><th>Player</th><th>Reason</th><th>Ends</th><th></th></tr>${S.mutes.map(b=>`<tr><td><b>${esc(b.name)}</b></td><td>${esc(b.reason)}</td><td>${until(b.expires)}</td><td>${can(2)?btn('unmute',b,'Unmute'):''}</td></tr>`).join('')}</table>`:'<div class="empty">No one is muted.</div>'}</div>`
};
function foundHTML(){const f=found;if(f.error)return `<div class="card empty">${esc(f.error)}. Check the spelling and try again.</div>`;
 return `<div class="card"><div class="prof">${av(f.userId,f.name).replace('class="av"','class="av"')}<div style="flex:1"><h2>${esc(f.displayName)}${f.banned?'<span class="tag">Banned</span>':''}${f.muted?'<span class="tag m">Muted</span>':''}</h2><span class="muted">@${esc(f.name)}, ID ${f.userId}${f.created?', joined Roblox '+new Date(f.created).toLocaleDateString():''}. ${f.online?'In your game now.':'Not in your game.'}${f.play?` Played ${dur(f.play.total*1000)} in total, ${f.play.points} points.`:''}</span></div></div>
 <div class="acts mt">${btn('warn',f,'Warn')}${btn('kick',f,'Kick')}${can(2)?(f.muted?btn('unmute',f,'Unmute'):btn('mute',f,'Mute')):''}${can(2)?btn('points',f,'Points'):''}${f.banned?(can(3)?btn('unban',f,'Unban','sm'):''):(can(2)?btn('ban',f,'Ban','danger sm'):'')}${can(3)?`<a class="btnlink" style="padding:6px 11px;font-size:13px" href="/api/export?userId=${f.userId}">Export data</a>${btn('erase',f,'Erase data')}`:''}</div></div>
 <div class="card mt"><h3>Logbook</h3>${f.logbook.length?`<table><tr><th>When</th><th>Action</th><th>Reason</th><th>By</th></tr>${[...f.logbook].reverse().map(e=>`<tr><td>${ago(e.time)}</td><td class="ty ${e.type}">${esc(e.type)}</td><td>${esc(e.reason)}</td><td>${esc(e.by||'')}</td></tr>`).join('')}</table>`:'<div class="empty">Clean record. No entries yet.</div>'}</div>`}

function render(){
 $('#nav').innerHTML=Object.entries(PAGES).filter(([k,[,,,r]])=>can(r||1)).map(([k,[t,,ic]])=>`<a tabindex="0" data-p="${k}" class="${k===page?'on':''}"><svg class="i" viewBox="0 0 24 24">${I[ic]}</svg>${t}${k==='calls'&&S.openCalls?`<span class="badge">${S.openCalls}</span>`:''}</a>`).join('');
 $('#title').textContent=PAGES[page][0];$('#sub').textContent=PAGES[page][1];$('#me').textContent=S.me?S.me.user+' ('+S.me.role+')':'';
 $('#dot').className='dot'+(S.connected?' on':'');$('#st').textContent=S.connected?`Game connected, ${S.servers} server${S.servers>1?'s':''}`:'Waiting for game';
 $('#view').innerHTML=VIEWS[page]();
 if(page==='lookup'){$('#sf').onsubmit=e=>{e.preventDefault();search($('#q').value)};if(found){$('#q').value=found.name||'';$('#res').innerHTML=foundHTML()}}
 if(page==='chat')$('#fwf').onsubmit=e=>{e.preventDefault();const v=$('#fw').value.trim();if(v)setWords([...S.flagWords,v])};
 if(page==='overview')$('#annb').onclick=async()=>{const t=$('#ann').value.trim();if(!t)return;await api('/api/action',post({action:'announce',reason:t}));toast('Announcement sent');refresh()};
}
const post=o=>({method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(o)});
async function search(n){if(!n.trim())return;found=await api('/api/lookup?name='+encodeURIComponent(n));if(found.userId)await loadAv([found.userId]);$('#res').innerHTML=foundHTML()}
async function loadAv(ids){const need=ids.filter(i=>!AV[i]);if(need.length)Object.assign(AV,await api('/api/avatars?ids='+need.join(',')))}
async function refresh(){S=await api('/api/state');await loadAv(S.players.map(p=>p.userId));if(page!=='lookup'&&!(document.activeElement&&document.activeElement.closest('#view input,#view textarea,#view select')))render();else{$('#dot').className='dot'+(S.connected?' on':'');$('#st').textContent=S.connected?`Game connected, ${S.servers} server${S.servers>1?'s':''}`:'Waiting for game'}}

const DUR=[[0,'Permanent'],[10,'10 minutes'],[60,'1 hour'],[1440,'1 day'],[10080,'7 days']],VERB={warn:'Warn',kick:'Kick',mute:'Mute',ban:'Ban',points:'Update points'};
function ask(a,u){
 $('#dt').textContent=`${VERB[a]}: ${u.name}`;
 const durs=DUR.filter(d=>d[0]||can(3));
 $('#dd').innerHTML=(a==='points'?`<label for="amt">Points (use a minus sign to remove)</label><input id="amt" type="number" value="5">`:'')+`<label for="r">Reason</label><textarea id="r" rows="3" maxlength="200" placeholder="${a==='points'?'Why?':'Shown to the player and saved in their logbook'}"></textarea>`+(a==='ban'||a==='mute'?`<label for="d">Duration</label><select id="d">${durs.map(d=>`<option value="${d[0]}">${d[1]}</option>`).join('')}</select>`:'');
 $('#dok').className=a==='ban'?'danger':'';$('#dok').textContent=VERB[a];
 $('#dok').onclick=async()=>{const reason=$('#r').value.trim()||'No reason given',minutes=a==='ban'||a==='mute'?+$('#d').value:0,amount=a==='points'?Math.trunc(+$('#amt').value)||0:0;if(a==='points'&&!amount)return;$('#dlg').close();await run(a,u,reason,minutes,amount)};
 $('#dlg').showModal();$(a==='points'?'#amt':'#r').focus();
}
async function run(a,u,reason='Lifted by moderator',minutes=0,amount=0){
 const r=await api('/api/action',post({action:a,userId:u.userId,name:u.name,reason,minutes,amount}));
 if(r.error)return toast(r.error);
 toast(({warn:'Warning sent',kick:'Kick sent',mute:'Muted',ban:'Ban applied',unban:'Unbanned',unmute:'Unmuted',points:'Points updated'})[a]);
 await refresh();if(found&&found.userId===u.userId)search(found.name);
}
const dur=ms=>{const m=Math.floor(ms/60000);return m<60?m+' min':Math.floor(m/60)+'h '+m%60+'m'};
async function setWords(w){const r=await api('/api/flagwords',post({words:w}));if(r.error)toast(r.error);refresh()}
async function saveRule(id){const c=document.querySelector(`[data-rule="${id}"]`),params={};c.querySelectorAll('[data-k]').forEach(i=>params[i.dataset.k]=i.value);
 const r=await api('/api/rules',post({id,enabled:c.querySelector('[data-en]').checked,params}));toast(r.error||'Automation saved');refresh()}
async function staffOp(op,user){let b={op,username:user};
 if(op==='add')b={op,username:$('#su').value,password:$('#sp').value,role:$('#sr').value};
 else if(op==='remove'&&!confirm('Remove '+user+'?'))return;
 else if(op==='setrole')b.role=document.querySelector(`[data-rolefor="${user}"]`).value;
 const r=await api('/api/staff',post(b));toast(r.error||'Staff updated');refresh()}
async function loadSetup(){SK=await api('/api/setup');if(page==='setup')render()}
async function setupOp(op){
 if(op==='reveal'){const i=$('#gk');i.type=i.type==='password'?'text':'password';return}
 try{const t=op==='copy'?await (await fetch('/api/bridge')).text():SK.gameKey;await navigator.clipboard.writeText(t);toast(op==='copy'?'Script copied':'Key copied')}catch{toast('Copy failed. Use Download instead.')}}
async function eraseUser(u){if(!confirm(`Permanently erase stored data for ${u.name}? This removes their logbook, playtime, points and ModCalls. An active ban is kept. This cannot be undone.`))return;
 const r=await api('/api/erase',post({userId:u.userId}));toast(r.error||'Data erased');found=null;if($('#res'))$('#res').innerHTML='';refresh()}
async function saveQuota(){const r=await api('/api/settings',post({quotaMinutes:$('#qm').value}));toast(r.error||'Quota saved');refresh()}
async function sess(op){const r=await api('/api/session',post({op,type:$('#stype')?.value,notes:$('#snote')?.value}));if(r.error)return toast(r.error);toast({start:'Session started',end:'Session ended',addall:'Everyone added'}[op]);refresh()}
async function doCall(id,op,note){const r=await api('/api/call',post({id,op,note}));toast(r.error||(op==='claim'?'Claimed':'Resolved'));refresh()}
function callOp(id,op){if(op==='claim')return doCall(id,op,'');
 $('#dt').textContent='Resolve ModCall #'+id;$('#dd').innerHTML='<label for="r">Resolution note (sent to the player)</label><textarea id="r" rows="3" maxlength="200" placeholder="What was done?"></textarea>';
 $('#dok').className='';$('#dok').textContent='Resolve';$('#dok').onclick=()=>{const n=$('#r').value.trim();$('#dlg').close();doCall(id,op,n)};$('#dlg').showModal()}
document.addEventListener('click',e=>{
 const p=e.target.closest('[data-p]');if(p){page=p.dataset.p;if(page!=='lookup')found=null;if(page==='setup')loadSetup();return render()}
 const su=e.target.closest('[data-setup]');if(su)return setupOp(su.dataset.setup);
 const rs=e.target.closest('[data-rule-save]');if(rs)return saveRule(rs.dataset.ruleSave);
 const sf=e.target.closest('[data-staff]');if(sf)return staffOp(sf.dataset.staff,sf.dataset.user);
 if(e.target.closest('[data-quota]'))return saveQuota();
 const fw=e.target.closest('[data-fw]');if(fw)return setWords(S.flagWords.filter(w=>w!==fw.dataset.fw));
 const se=e.target.closest('[data-s]');if(se)return sess(se.dataset.s);
 const ca=e.target.closest('[data-call]');if(ca)return callOp(+ca.dataset.call,ca.dataset.op);
 const b=e.target.closest('button[data-a]');if(!b)return;const u={userId:+b.dataset.id,name:b.dataset.n},a=b.dataset.a;
 a==='erase'?eraseUser(u):['unban','unmute'].includes(a)?run(a,u):ask(a,u);
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.dataset?.p)e.target.click()});
$('#dc').onclick=()=>$('#dlg').close();
function login(show){$('#login').hidden=!show;$('#app').hidden=show;if(show)$('#pw').focus()}
$('#lf').onsubmit=async e=>{e.preventDefault();const r=await fetch('/login',post({username:$('#un').value,password:$('#pw').value}));if(r.ok){$('#pw').value='';$('#le').textContent='';login(false);refresh()}else $('#le').textContent=(await r.json()).error};
$('#out').onclick=async()=>{await fetch('/logout',{method:'POST'});login(true)};
fetch('/api/state').then(r=>{if(r.status===401)login(true);else{login(false);refresh()}});
setInterval(()=>{if(!document.hidden&&!$('#app').hidden&&!$('#dlg').open)refresh().catch(()=>{})},6000);
</script></body></html>
