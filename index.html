<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<script>try{var t=localStorage.getItem("sentinel_theme");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<meta name="color-scheme" content="light dark">
<title>Sentinel</title><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png"><link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
:root{
 --bg:#fff;--side:#f7f8fa;--ink:#1a1f36;--ink2:#3c4257;--muted:#697386;--faint:#a3acb9;--line:#e3e8ee;--hover:#f6f8fa;--sel:#f0f1f7;
 --ac:#635bff;--ac2:#5148e8;--acs:#efeeff;--acr:rgba(99,91,255,.32);
 --ok:#0a7c2f;--okb:#d7f7c2;--wa:#983705;--wab:#fcedb9;--er:#c0123c;--erb:#ffe7ef;--in:#0055bc;--inb:#d1ecff;--ne:#545969;--neb:#ebeef1;
 --sh:0 0 0 1px rgba(60,66,87,.08),0 2px 5px rgba(60,66,87,.06),0 1px 1px rgba(0,0,0,.04);--shl:0 15px 35px rgba(50,50,93,.18),0 5px 15px rgba(0,0,0,.08);
 --f:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Ubuntu,sans-serif;--m:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){
 --bg:#0f1117;--side:#0b0d12;--ink:#e8eaf0;--ink2:#c4c8d4;--muted:#8a91a5;--faint:#596074;--line:#232733;--hover:#161a23;--sel:#1b1f2b;
 --ac:#7a73ff;--ac2:#8e88ff;--acs:rgba(122,115,255,.14);--acr:rgba(122,115,255,.4);
 --ok:#5fd37f;--okb:rgba(52,199,89,.14);--wa:#f5b44a;--wab:rgba(245,180,74,.14);--er:#ff7a93;--erb:rgba(255,92,124,.14);--in:#6cb6ff;--inb:rgba(56,139,253,.15);--ne:#a3aabd;--neb:rgba(140,149,170,.15);
 --sh:0 0 0 1px rgba(255,255,255,.06),0 2px 8px rgba(0,0,0,.35);--shl:0 20px 50px rgba(0,0,0,.6)}}:root[data-theme=dark]{
 --bg:#0f1117;--side:#0b0d12;--ink:#e8eaf0;--ink2:#c4c8d4;--muted:#8a91a5;--faint:#596074;--line:#232733;--hover:#161a23;--sel:#1b1f2b;
 --ac:#7a73ff;--ac2:#8e88ff;--acs:rgba(122,115,255,.14);--acr:rgba(122,115,255,.4);
 --ok:#5fd37f;--okb:rgba(52,199,89,.14);--wa:#f5b44a;--wab:rgba(245,180,74,.14);--er:#ff7a93;--erb:rgba(255,92,124,.14);--in:#6cb6ff;--inb:rgba(56,139,253,.15);--ne:#a3aabd;--neb:rgba(140,149,170,.15);
 --sh:0 0 0 1px rgba(255,255,255,.06),0 2px 8px rgba(0,0,0,.35);--shl:0 20px 50px rgba(0,0,0,.6)}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--f);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}button{background:none;border:0;padding:0;cursor:pointer}
a{color:var(--ac);text-decoration:none}a:hover{color:var(--ac2)}
h1{font-size:28px;line-height:1.2;font-weight:700;letter-spacing:-.02em;margin:0}h2{font-size:18px;font-weight:600;margin:0;letter-spacing:-.01em}h3{font-size:15px;font-weight:600;margin:0}
.ic{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.muted{color:var(--muted)}.sm{font-size:13px}.xs{font-size:12px}.mono{font-family:var(--m);font-size:12.5px}.b{font-weight:600}
.row{display:flex;align-items:center;gap:10px}.col{display:flex;flex-direction:column;gap:6px}.sp{flex:1}.wrap{flex-wrap:wrap}.mt{margin-top:20px}.mt2{margin-top:32px}

/* shell */
.app{display:grid;grid-template-columns:244px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:14px 10px;gap:4px;z-index:20;overflow-y:auto;overscroll-behavior:contain}
.ws{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:8px;text-align:left;width:100%}.ws:hover{background:var(--sel)}
.logo{width:28px;height:28px;border-radius:7px;display:grid;place-items:center;color:#fff;font-weight:700;font-size:13px;background:linear-gradient(135deg,#7a73ff,#635bff 45%,#0ea5e9);flex:none;box-shadow:inset 0 0 0 1px rgba(255,255,255,.18)}
.ws .n{flex:1;min-width:0;line-height:1.2}.ws b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ws small{color:var(--muted);font-size:12px}
.search{display:flex;align-items:center;gap:8px;margin:6px 2px 10px;padding:6px 10px;border-radius:7px;color:var(--muted);background:var(--bg);box-shadow:var(--sh);font-size:13px;text-align:left}
.search kbd{margin-left:auto;font:11px var(--m);color:var(--faint);border:1px solid var(--line);border-radius:4px;padding:0 5px}
.navl{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--faint);padding:14px 10px 4px}
.nv{display:flex;align-items:center;gap:10px;padding:6px 10px;border-radius:6px;color:var(--ink2);font-weight:500;font-size:14px}
.nv:hover{background:var(--sel);color:var(--ink)}.nv.on{color:var(--ac);background:var(--acs)}.nv .ic{color:var(--muted)}.nv.on .ic{color:var(--ac)}
.nv .cnt{margin-left:auto;background:var(--er);color:#fff;border-radius:99px;font-size:11px;font-weight:600;min-width:18px;height:18px;display:grid;place-items:center;padding:0 5px}
.sfoot{margin-top:auto;display:flex;flex-direction:column;gap:6px}
.live{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);padding:6px 10px}.dot{width:8px;height:8px;border-radius:50%;background:var(--faint);flex:none}.dot.on{background:#30c75a;box-shadow:0 0 0 3px rgba(48,199,90,.18);animation:pulse 2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 5px rgba(48,199,90,.06)}}
.me{display:flex;align-items:center;gap:9px;padding:6px 8px;border-radius:8px;text-align:left;width:100%}.me:hover{background:var(--sel)}.me .n{flex:1;min-width:0;line-height:1.2}.me b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.me small{font-size:12px;color:var(--muted)}
.menu{position:fixed;background:var(--bg);border-radius:10px;box-shadow:var(--shl);border:1px solid var(--line);padding:6px;z-index:60;min-width:230px;animation:pop .14s ease}
.menu button,.menu a{display:flex;align-items:center;gap:9px;width:100%;padding:7px 10px;border-radius:6px;color:var(--ink);font-size:14px;text-align:left}.menu button:hover,.menu a:hover{background:var(--sel)}
.menu hr{border:0;border-top:1px solid var(--line);margin:5px 2px}.menu .lab2{font-size:12px;color:var(--muted);padding:6px 10px 2px}
main{min-width:0}.page{max-width:1140px;margin:0 auto;padding:32px 40px 80px}.page.anim{animation:in .22s ease}
@keyframes in{from{opacity:0;transform:translateY(5px)}}@keyframes pop{from{opacity:0;transform:scale(.97)}}
.top{display:none}
.hd{display:flex;align-items:flex-end;gap:16px;margin-bottom:24px;flex-wrap:wrap}.hd .t{flex:1;min-width:240px}.hd p{margin:6px 0 0;color:var(--muted);font-size:14.5px}
.crumb{font-size:13px;color:var(--muted);margin-bottom:8px}.crumb a{color:var(--muted)}.crumb a:hover{color:var(--ac)}

/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:32px;padding:0 12px;border-radius:6px;font-weight:500;font-size:14px;white-space:nowrap;transition:background .12s,box-shadow .12s,transform .06s;background:var(--bg);color:var(--ink);box-shadow:0 0 0 1px rgba(60,66,87,.16),0 1px 1px rgba(0,0,0,.08)}
.btn:hover{background:var(--hover)}.btn:active{transform:translateY(1px)}.btn:focus-visible,.inp:focus,.nv:focus-visible{outline:0;box-shadow:0 0 0 4px var(--acr)}
.btn.pri{background:var(--ac);color:#fff;box-shadow:0 1px 1px rgba(0,0,0,.12),0 2px 5px rgba(60,66,87,.12),inset 0 -1px 1px rgba(0,0,0,.12)}.btn.pri:hover{background:var(--ac2)}
.btn.red{background:#df1b41;color:#fff;box-shadow:0 1px 1px rgba(0,0,0,.12)}.btn.red:hover{background:#c0123c}.btn.ghost{box-shadow:none;background:none;color:var(--ac)}.btn.ghost:hover{background:var(--acs)}
.btn.s{height:28px;padding:0 10px;font-size:13px}.btn.l{height:40px;padding:0 18px;font-size:15px}.btn[disabled]{opacity:.5;pointer-events:none}.btn.w{width:100%}
@media(prefers-color-scheme:dark){:where(:root:not([data-theme=light])) .btn{box-shadow:0 0 0 1px rgba(255,255,255,.1)}}:where(:root[data-theme=dark]) .btn{box-shadow:0 0 0 1px rgba(255,255,255,.1)}
.inp{width:100%;height:34px;padding:0 10px;border-radius:6px;border:0;background:var(--bg);box-shadow:0 0 0 1px rgba(60,66,87,.18),0 1px 1px rgba(0,0,0,.06);transition:box-shadow .12s}
@media(prefers-color-scheme:dark){:where(:root:not([data-theme=light])) .inp{box-shadow:0 0 0 1px rgba(255,255,255,.12);background:#0b0d12}}:where(:root[data-theme=dark]) .inp{box-shadow:0 0 0 1px rgba(255,255,255,.12);background:#0b0d12}
textarea.inp{height:auto;padding:8px 10px;resize:vertical;min-height:76px}select.inp{padding-right:28px}
.lab{display:block;font-weight:500;font-size:13px;margin:16px 0 6px;color:var(--ink2)}.lab:first-child{margin-top:0}.hint{font-size:12.5px;color:var(--muted);margin-top:6px}
.seg{display:inline-flex;padding:2px;border-radius:7px;background:var(--neb);gap:2px;flex-wrap:wrap}.seg button{padding:5px 12px;border-radius:5px;font-size:13px;font-weight:500;color:var(--ink2)}.seg button.on{background:var(--bg);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.tog{position:relative;width:36px;height:20px;border-radius:99px;background:var(--faint);transition:.18s;flex:none}.tog::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.18s;box-shadow:0 1px 2px rgba(0,0,0,.3)}.tog.on{background:var(--ac)}.tog.on::after{transform:translateX(16px)}
.chk{display:flex;gap:10px;align-items:flex-start;padding:8px 0;cursor:pointer}.chk input{margin-top:3px;accent-color:var(--ac)}
.tabs{display:flex;gap:22px;border-bottom:1px solid var(--line);margin-bottom:22px;overflow-x:auto}.tabs a{padding:0 1px 10px;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs a:hover{color:var(--ink)}.tabs a.on{color:var(--ac);border-color:var(--ac)}.tabs .n{font-size:12px;background:var(--neb);color:var(--ne);border-radius:99px;padding:1px 7px;margin-left:5px}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{padding:3px 11px;border-radius:99px;font-size:13px;font-weight:500;color:var(--ink2);box-shadow:inset 0 0 0 1px var(--line)}.chip.on{background:var(--ink);color:var(--bg);box-shadow:none}

/* data */
.card{background:var(--bg);border-radius:10px;box-shadow:var(--sh);padding:20px}.card.p0{padding:0}.card h3+p{margin:4px 0 0}
.grid{display:grid;gap:16px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.gm{grid-template-columns:minmax(0,1.7fr) minmax(0,1fr)}
.kpi{padding:16px 18px 12px}.kpi .kl{font-size:13px;color:var(--muted);font-weight:500}.kpi .kv{font-size:26px;font-weight:600;letter-spacing:-.02em;margin:2px 0 4px;font-variant-numeric:tabular-nums}.kpi .kf{font-size:12px;color:var(--faint);display:flex;justify-content:space-between;margin-top:2px}
.spk{width:100%;height:42px;display:block}.spk .a{fill:url(#sg)}.spk .l{fill:none;stroke:var(--ac);stroke-width:1.8;vector-effect:non-scaling-stroke}
table{width:100%;border-collapse:collapse}th{text-align:left;font-size:12px;font-weight:500;color:var(--muted);padding:9px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle}tr:last-child td{border-bottom:0}tbody tr{transition:background .1s}tbody tr:hover{background:var(--hover)}tr.click{cursor:pointer}
.tw{overflow-x:auto}.tbar{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.bdg{display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 7px;border-radius:4px;font-size:12px;font-weight:500;background:var(--neb);color:var(--ne);white-space:nowrap}
.bdg.ok{background:var(--okb);color:var(--ok)}.bdg.wa{background:var(--wab);color:var(--wa)}.bdg.er{background:var(--erb);color:var(--er)}.bdg.in{background:var(--inb);color:var(--in)}.bdg.ac{background:var(--acs);color:var(--ac)}
.rtag{display:inline-flex;align-items:center;gap:6px;font-weight:500;white-space:nowrap}.rtag i{width:9px;height:9px;border-radius:3px;flex:none}
.av{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#c3c8d6,#9aa1b5);color:#fff;font-size:11.5px;font-weight:600;display:grid;place-items:center;flex:none;overflow:hidden}.av img{width:100%;height:100%;object-fit:cover}.av.l{width:42px;height:42px;font-size:14px}.av.xl{width:68px;height:68px;font-size:22px}
.who{display:flex;align-items:center;gap:11px;min-width:0}.who b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.who small{display:block;font-size:12.5px;color:var(--muted)}
.bar{height:6px;border-radius:99px;background:var(--neb);overflow:hidden;min-width:90px}.bar i{display:block;height:100%;border-radius:99px;background:var(--ac)}.bar.done i{background:#30c75a}
.empty{padding:48px 20px;text-align:center;color:var(--muted)}.empty .ei{width:44px;height:44px;border-radius:12px;background:var(--acs);color:var(--ac);display:grid;place-items:center;margin:0 auto 12px}.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}
.banner{display:flex;align-items:center;gap:14px;padding:14px 18px;border-radius:10px;background:var(--acs);margin-bottom:20px}.banner .ic{width:20px;height:20px;color:var(--ac)}.banner.wa{background:var(--wab)}.banner.wa .ic{color:var(--wa)}
.feed>div{display:flex;gap:12px;padding:10px 18px;border-bottom:1px solid var(--line);font-size:13.5px}.feed>div:last-child{border:0}.feed .t{color:var(--faint);font-size:12px;white-space:nowrap;margin-left:auto}
.steps{display:flex;align-items:center;gap:4px;flex-wrap:wrap}.steps .arr{color:var(--faint)}
.kv2{display:grid;grid-template-columns:150px 1fr;gap:10px 16px;font-size:14px}.kv2 dt{color:var(--muted)}.kv2 dd{margin:0}
.chatl{padding:9px 18px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:baseline}.chatl:last-child{border:0}.chatl.fl{background:var(--wab)}
.chatl .acts{opacity:0;margin-left:auto;display:flex;gap:6px;transition:.12s}.chatl:hover .acts{opacity:1}
.ctx{background:var(--hover);border-radius:8px;padding:10px 14px;font-size:13px;margin-top:12px}.ctx div+div{margin-top:3px}
code{font-family:var(--m);font-size:12.5px;background:var(--neb);padding:1px 6px;border-radius:4px}
.keybox{display:flex;align-items:center;gap:8px;padding:6px 6px 6px 12px;border-radius:7px;box-shadow:0 0 0 1px var(--line);font-family:var(--m);font-size:13px}.keybox span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sw{display:inline-flex;gap:6px;flex-wrap:wrap}.sw label{width:24px;height:24px;border-radius:6px;cursor:pointer;position:relative}.sw input{position:absolute;opacity:0}.sw input:checked+i{position:absolute;inset:-3px;border-radius:8px;box-shadow:0 0 0 2px var(--ac)}
.pg{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}.pg:last-child{border:0}

/* drawer, modal, palette, toast */
#dw .scrim,#ck .scrim{position:fixed;inset:0;background:rgba(15,17,30,.36);z-index:70;opacity:0;transition:opacity .2s}
#dw.open .scrim,#ck.open .scrim{opacity:1}
.dwr{position:fixed;top:0;right:0;bottom:0;width:min(480px,100vw);background:var(--bg);z-index:71;display:flex;flex-direction:column;box-shadow:var(--shl);transform:translateX(100%);transition:transform .26s cubic-bezier(.2,.8,.2,1)}
#dw.open .dwr{transform:none}.dwr.c{top:50%;left:50%;right:auto;bottom:auto;width:min(440px,calc(100vw - 32px));max-height:85vh;border-radius:12px;transform:translate(-50%,-48%) scale(.97);opacity:0;transition:.2s}
#dw.open .dwr.c{transform:translate(-50%,-50%);opacity:1}
.dwh{display:flex;align-items:flex-start;gap:12px;padding:20px 24px;border-bottom:1px solid var(--line)}.dwh .t{flex:1}.dwh p{margin:3px 0 0;color:var(--muted);font-size:13.5px}
.x{width:28px;height:28px;border-radius:6px;display:grid;place-items:center;color:var(--muted);font-size:20px}.x:hover{background:var(--sel)}
.dwb{padding:20px 24px;overflow:auto;flex:1}.dwf{display:flex;justify-content:flex-end;gap:8px;padding:14px 24px;border-top:1px solid var(--line)}
.esc{margin-top:10px;padding:12px 14px;border-radius:8px;background:var(--acs);font-size:13.5px}
.ckb{position:fixed;top:12vh;left:50%;transform:translateX(-50%);width:min(620px,calc(100vw - 32px));background:var(--bg);border-radius:12px;box-shadow:var(--shl);z-index:71;overflow:hidden;animation:pop .14s ease}
.ckb input{width:100%;border:0;outline:0;background:none;padding:18px 20px;font-size:16px;border-bottom:1px solid var(--line)}
.ckl{max-height:52vh;overflow:auto;padding:6px}.ckl .sec{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--faint);padding:10px 12px 4px}
.ckl button{display:flex;align-items:center;gap:10px;width:100%;padding:9px 12px;border-radius:7px;text-align:left}.ckl button.on{background:var(--acs);color:var(--ac)}.ckl small{margin-left:auto;color:var(--faint);font-size:12px}
.ckf{display:flex;gap:14px;padding:9px 16px;border-top:1px solid var(--line);font-size:12px;color:var(--faint)}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:90;display:grid;gap:8px;justify-items:center}
.toast{display:flex;align-items:center;gap:9px;background:#1a1f36;color:#fff;padding:10px 16px;border-radius:8px;font-size:14px;box-shadow:var(--shl);animation:tin .25s cubic-bezier(.2,.9,.3,1.3)}.toast.err{background:#c0123c}.toast .ic{color:#5fe08a}.toast.err .ic{color:#fff}
@keyframes tin{from{opacity:0;transform:translateY(12px) scale(.96)}}
.skel{background:linear-gradient(90deg,var(--neb),var(--hover),var(--neb));background-size:200% 100%;animation:sk 1.2s infinite;border-radius:6px;height:14px}@keyframes sk{to{background-position:-200% 0}}
.spin{width:22px;height:22px;border-radius:50%;border:2.5px solid var(--neb);border-top-color:var(--ac);animation:rot .8s linear infinite}@keyframes rot{to{transform:rotate(360deg)}}

/* auth + onboarding */
.auth{min-height:100vh;display:grid;place-items:center;padding:24px;position:relative;overflow:hidden;background:var(--side)}
.band{position:absolute;left:-10%;right:-10%;top:-38vh;height:78vh;transform:skewY(-11deg);background:linear-gradient(115deg,#635bff 0%,#80e9ff 30%,#a960ee 55%,#ff6c95 78%,#ffcb57 100%);background-size:220% 220%;animation:flow 14s ease infinite;opacity:.95}
@keyframes flow{50%{background-position:100% 50%}}
.acard{position:relative;width:100%;max-width:420px;background:var(--bg);border-radius:12px;box-shadow:var(--shl);padding:38px 36px 28px}
.acard .logo{width:40px;height:40px;border-radius:10px;font-size:18px;margin-bottom:22px}.acard h1{font-size:24px}.acard .lead{color:var(--muted);margin:6px 0 24px;font-size:15px}

.oa.dk{background:#1a1f36;color:#fff;box-shadow:none;--rbx:#1a1f36}.oa.dk:hover{background:#2a2f4a;color:#fff}

 let r;try{const o=body!==undefined?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}:{};o.signal=AbortSignal.timeout(20000);r=await fetch(path,o)}catch{toast('No connection. Check your internet.','err');return{error:'offline',_s:0}}

const APPV='5.9',CHANGELOG=[{"v":"5.9","date":"Oct 17, 2026","title":"Daily summary and game health","items":["Daily summary (Settings, Notifications, owner only): once a day at the hour you pick, a short overview of actions, reports, chat alerts, what is waiting and any problems. In your Inbox, and in Discord if you turn it on.","Game connection card on Home: green while servers check in, red when the game stops checking in while players were in game. An empty game is not an alarm.","Game lost contact alert: the owner hears about it once, and again when the game is back. Discord is off until the owner turns it on."]},{"v":"5.8","date":"Oct 17, 2026","title":"Chat alerts and risk score","items":["Chat alert words (Settings, Automations): get told straight away when a watched word or phrase shows up in chat, even with leetspeak or spaced-out letters. One alert per player per word every 5 minutes. Alerts go to the Inbox, Discord, or both, and never take action.","Risk score: a 0 to 100 number on each player profile and in the Players list, made from warnings, mutes, bans, open reports, flagged chat, alt hints and account age. Older activity counts less. Hover it to see exactly what it is made of. It is advice for staff only and is never shown to players."]},{"v":"5.7","date":"Oct 17, 2026","title":"Staff workflow","items":["Send up: staff can send a report, an appeal or a logbook entry to a senior rank with a note. Seniors take it, return it with a note, or resolve it, and everything is in the audit log.","Getting started checklist for new staff on Home, with items that tick themselves (first report, first appeal, a practice case, reading the rulebook, a first shift). Owners edit the list per rank and see everyone in Team, Onboarding.","Training page (off by default): staff practise on past cases with names, IDs, links and personal details removed, then see what was really done. Owners can write their own practice cases."]},{"v":"5.6","date":"Oct 17, 2026","title":"Notices and limits","items":["Messages from the Sentinel team, such as a reminder to update your scripts, now show on Home and in your Inbox.","Owners see a warning in the Inbox when the workspace is close to its member or logbook limit.","New features like Chat logs are switched on for workspaces step by step.","Erasing a player's data now also removes their alt-account hints, watchlist entry and appeals."]},{"v":"5.5","date":"Oct 17, 2026","title":"Chat logs","items":["New Chat logs page: in-game chat grouped in boxes of 10 messages from one server, each with its own ID, kept for 7, 14 or 30 days (you choose, 14 by default).","Search by box ID, player, words, date, server or flag. Flagged boxes show swearing and slurs (even disguised ones), links, Discord invites, possible personal info, shouting, repeats, spam, very long messages and strange characters.","Moderate a player straight from a chat line with the box attached as evidence, or turn a whole box into a report.","A new Read and search chat logs permission, given to Moderator and up. Owners can edit the word list in Settings, Automations.","Fix: in very busy servers, chat beyond 100 messages per check-in was dropped. Up to 300 now arrive."]},{"v":"5.4","date":"Oct 17, 2026","title":"Machine bans","items":["Machine bans (Settings, Game): when you have a Roblox API key saved, bans can also cover the other accounts Roblox links to that player. Roblox does the matching; Sentinel stores no device data.","Bans and unbans now reach Roblox straight away, even when no game server is running, so a reverted suspension lifts the Roblox ban too.","The Moderate window has a Ban across all accounts box, and the logbook marks these as Machine ban (Roblox alt detection).","Alt-account hints now also look at friends with a banned player, small groups shared with one, and joining soon after a kick. Each hint is labelled Weak, Likely or Strong, with the reasons."]},{"v":"5.3","date":"Oct 16, 2026","title":"Clearer history, smoother banners","items":["Moderation history now says what happened to each punishment: Active (with how long is left), Punishment fulfilled once a mute or suspension has run its course, Ended early if staff lifted it, or Reverted.","In-game warnings and notices have a new look: a sleeker card with a timer line that runs round its border, and a smooth slide in and out. Tap a banner to close it.","Add the updated SentinelClient script to your game for the smoothest banners. Update both game scripts.","The website now tells you when a newer player script (SentinelClient) is available, the same way it does for the game script. It shows in Settings, Game, on Home and in your Inbox."]},{"v":"5.2","date":"Oct 15, 2026","title":"Faster moderating","items":["Reason presets: save common reasons and lengths (like Spamming, 30 minute mute) and tap one in the Moderate window. Edit them in Settings, Automations.","More auto-moderation: spam, repeated messages, links, shouting and rapid rejoining. Staff are never touched, and every action is logged as Automation.","A Report button for players. They pick who they are reporting and say what happened, and you see the chat around it. Update both game scripts.","A Servers page: see every running server, announce to just one, or close one.","Watchlist tab on Players, and pinned notes that show at the top of a player's profile.","Staff strikes and warnings, and a Performance tab in Team showing what each person has done lately."]},{"v":"5.1","date":"Oct 15, 2026","title":"Safer and clearer","items":["Second approval: choose permanent bans, rank changes and deleting the workspace to need a second person. Requests wait in the Inbox for 3 days.","Ban sync: copy new bans from your other games into this one. It only works between games you own.","Alt-account queue: each hint now shows how strong it is and which banned player it matches. Watch it, mark it as not an alt, and see the outcome in the new Reviewed tab.","Banned players now see your game's name, the reason, whether it ends, and where to appeal on Roblox's own ban screen. Update your game script.","Optional public pages: a web report form and a moderation log with partly hidden names. Both are off until you turn them on.","A new Analytics page, a dark mode, and a better layout on phones."]},{"v":"5.0","date":"Oct 14, 2026","title":"The big one","items":["Evidence on every action: attach clip links and a private note, and the player's recent chat is saved with the record. Appeal reviewers see all of it.","Appeals: reply to the player, who checks the result on a private link. Quick replies, and an optional rule that lifting a permanent ban needs two staff.","Roblox group sync: map group roles to Sentinel ranks. Promotions and departures flow through automatically, and group staff can join without an invite.","Forms: staff applications, player reports and staff-only forms. Accepting an applicant creates an invite locked to their Roblox account.","Shifts: plan who is on duty, let staff sign up, and see who was really in game during their shift.","Worth a look: hints when a new player might be a banned player on a new account. Hints only, never automatic punishments.","Discord bot: /warn, /kick, /mute, /ban, /unban and /lookup, plus buttons on appeals, applications and unban approvals.","A public status page, tougher rate limits, and alerts to the site admin when something breaks."]},{"v":"4.7","date":"Oct 13, 2026","title":"Security and sign-in","items":["Continue with Roblox is now the recommended way to sign in. Google users are nudged to link their Roblox account.","Staff invites are safer: choose how long a link lasts and lock it to one Roblox username. Invites for ranks with admin powers must be locked.","Two-step verification with any authenticator app, plus recovery codes. Owners can require it for administrators.","Fixed muting: a muted player can no longer chat, and is told why. Update your game script.","Fixed the countdown line that crossed the text on in-game warnings. Update your game script.","A short welcome notice explains that Sentinel is in alpha and updated often."]},{"v":"4.6","date":"Oct 13, 2026","title":"Script update alerts","items":["Whenever the game script changes, the owner and developers are told: a banner on Home, an Inbox item, and a message in game when they join.","Setup now warns you to remove the [ ] brackets around your game code. Sentinel also ignores stray brackets, quotes and spaces so a small slip no longer stops the game from connecting."]},{"v":"4.5","date":"Oct 13, 2026","title":"Live updates and a sleeker warning","items":["Chatlogs, Reports and the player audit page now update by themselves every 3 seconds, with a Live button to refresh right away.","Ban appeals: each player can send 2 every 5 days, and there is no minimum length any more.","The warning players see in game is now a slim card that slides in, matching the website. Download the game script again from Settings, then Game, to get it."]},{"v":"4.4","date":"Oct 13, 2026","title":"Unbans that work with an empty game","items":["New in Settings, then Game: add a Roblox API key and accepted appeals lift the Roblox ban straight away, even when no server is running.","Bans and unbans wait up to 7 days for a server, and the game script now reports if Roblox refuses one."]},{"v": "4.3", "date": "Oct 13, 2026", "title": "Help, hover hints and version history", "items": ["New Help page with a searchable Q&A and a Feedback tab. Ask a question and read the reply there.", "Small ? marks next to key words. Hover or tap one to see what it does.", "This version history, so you can see what changed.", "Fixed: accepting a ban appeal now lifts the Roblox ban even when nobody is in the game. It is applied as soon as a server starts."]}, {"v": "4.2", "date": "Oct 13, 2026", "title": "Backups and a recycle bin", "items": ["Your workspace is backed up every night and kept for 7 days.", "Owners can back up now, download a copy, or restore from a file in Settings, then Backups.", "Deleted workspaces are kept for 30 days and can be brought back."]}, {"v": "4.1", "title": "Player audit", "items": ["Look up any player to see chat, staff actions, game joins and a playtime heatmap.", "Widgets let you show or hide the parts you care about."]}, {"v": "4.0", "title": "Moderation power tools", "items": ["Ban appeals with a public link and a review page.", "Watchlist: get an Inbox alert when someone you watch joins.", "One Inbox for reports, appeals, leave and watched players.", "Keyboard shortcuts (press ?), a welcome tour and starter rules."]}, {"v": "3.5", "title": "A sleeker Sentinel", "items": ["New macOS-style look and a smoother setup.", "Every game gets its own random game code, shown once."]}, {"v": "3.0", "title": "Sentinel for many games", "items": ["One site for many games, sign in with Google or Roblox, invite your team with links."]}];

const QAD=[["Getting started", [["What is Sentinel?", "Sentinel is a control room for your Roblox game. Your staff can see who is online, warn, mute, kick and ban players, answer reports, review ban appeals and track how much time moderators spend in game, all from one website."], ["Is Sentinel finished?", "Not yet. Sentinel is brand new and in <b>alpha</b>. It is updated often, around three times a day, so expect some bugs and changes. If you hit one, tell us on the <b>Feedback</b> tab and we will look at it."], ["How do I connect my game?", "Open <b>Settings → Game</b> (only the owner sees it). Copy the script, put it in a <b>Script</b> inside <b>ServerScriptService</b>, turn on <b>Allow HTTP Requests</b> (File, Experience Settings, Security), then paste your game code where it says <b>[INPUT CODE HERE]</b>. Press Play and the dashboard shows <b>Connected</b> within a few seconds."], ["Why does it say \"Not connected\"?", "Check that HTTP requests are allowed, the game code in the script is exact with <b>no square brackets [ ] around it</b>, and the script is a normal <b>Script</b>, not a LocalScript. If you turned on <b>Place lock</b>, the game must be running from that exact place. Studio tests count as place 0."], ["How do I know my game script is out of date?","When we change the game script, the dashboard tells you: a banner on Home, an item in your Inbox, and a message in your game when you join. Open <b>Settings → Game</b>, download the new script, paste your game code in and replace the old one. Your code and settings stay the same."],["I lost my game code. What now?", "The code is only shown once, when it is made. Go to <b>Settings → Game → Replace code</b> to make a new one. The old code stops working at once, so paste the new one into your script and republish."], ["Why can every game not use the same code?", "Each game gets its own random code. That keeps one game from reading or changing another game’s players, and a leaked code can be replaced in one click."]]], ["Moderation", [["How do I attach evidence?", "When you moderate someone, open <b>Evidence</b> in the sheet to add links to clips or screenshots and a private note. Their chat from the last hour is saved with the record too, unless you untick it. Add more later from <b>Details</b> on any record in their history. Whoever reviews an appeal sees all of it."], ["What does Worth a look mean?", "Sentinel flags a new player when their name is very close to a banned player's, or when two signs appear together: a brand-new Roblox account and a first join soon after a ban. These are hints, not proof. Nothing happens to the player automatically. Find them under <b>Players → Worth a look</b>, and turn hints off in <b>Settings → Automations</b>."], ["What is two-person unban?", "Turn it on in <b>Appeals</b>. Lifting a permanent ban, from an appeal or the ban list, then needs two different staff members to approve, so one person cannot quietly undo a ban. The owner can still do it alone."], ["What does \"Make the chat box disappear\" mean when I mute someone?","Ticked (the default), the player cannot type at all until the mute ends, as long as you added the small chat script from <b>Settings → Game</b>. Unticked, they keep their chat box but are warned that they are muted, and nobody sees what they type. Either way their messages are never shown to other players."], ["How do warnings, mutes, kicks and bans work?", "Open a player from <b>Players</b> and pick an action with a reason. The command reaches every running server within seconds. Bans and mutes can be timed or permanent, and everything is saved in the <b>Logbook</b>."], ["What are the Rulebook and the punishment ladder?", "The Rulebook lists your community rules. Each rule has a <b>punishment ladder</b>: the first offence might be a warning, the next a 1-day mute, then a ban. When staff pick a rule, Sentinel suggests the right step for that player’s history."], ["What is the watchlist?", "Open a player and press <b>Watch</b>. You are told in your Inbox, and by Discord if you set it up, the moment they join a server. Good for repeat offenders and suspected alts."], ["How do ban appeals work?", "Banned players can use your public appeal link (see <b>Appeals</b>). Staff with the review permission accept or deny. Accepting an appeal lifts the ban right away. You can turn appeals off at any time."], ["A player is still banned on Roblox after I unbanned them.","Roblox bans are lifted by a game server, so with nobody in your game the unban waits until a server starts. To lift it straight away, add a Roblox API key in <b>Settings → Game → Lift bans without a game server</b>. You can always unban from Creator Hub under your experience, then Moderation."],["How do I make a Roblox API key?","Open <b>create.roblox.com</b>, go to <b>Credentials → API Keys → Create API Key</b>. Under access permissions add the API system <b>User Restrictions API</b> and turn on <b>Write</b>, then choose your experience. Leave the IP address list alone, because Sentinel runs on many addresses. Create the key, copy it, and paste it in <b>Settings → Game</b>. Never share it. It is stored encrypted."],["Can I undo a mistake?", "Yes. Open the <b>Logbook</b> and revert the entry. Reverting a ban unbans the player, and the log keeps a record that it was reverted."]]], ["Your team", [["How do I sync ranks with my Roblox group?", "Open <b>Settings → Roblox group</b>, paste your group link and choose a Sentinel rank for each group role. Sentinel then gives everyone in those roles the matching rank, about every 10 minutes while your game has a server online, or when you press <b>Sync now</b>. It only reads your group and never changes it. You can also let group staff join from a link without an invite."], ["How do staff applications work?", "Go to <b>Forms</b>, press <b>New form</b> and pick <b>Staff application</b>. Share the link. When you accept someone, Sentinel creates an invite locked to the Roblox username they gave and shows it on their private status page, so nobody else can use it."], ["How do shifts work?", "Leads plan shifts in <b>Shifts</b>, with a time, a length and a number of spots. Staff sign up for open spots. Afterwards, Sentinel shows how long each person was actually in game during their shift."], ["Can we use Sentinel from Discord?", "Yes. The owner adds the bot and links the server in <b>Settings → Discord</b>. Each staff member links their own account there too. Then use <b>/warn</b>, <b>/kick</b>, <b>/mute</b>, <b>/ban</b>, <b>/unban</b> and <b>/lookup</b>. Commands use your Sentinel rank, so you can only do what you could do on the website. Appeals, applications and unban approvals arrive with buttons."], ["How do I invite staff?", "Go to <b>Team → Invites</b>, pick a rank, type their <b>Roblox username</b> and choose how long the link lasts. Send the link to them privately. Each link works once, and when it is locked to a Roblox username nobody else can use it, even if it leaks."], ["Why is an invite locked to a Roblox username?", "So a leaked link is useless. Only that Roblox account can accept it, and invites for ranks with admin powers must always be locked. If the person signed in with Google, they link their Roblox account first (the invite page offers it)."], ["Why should I sign in with Roblox?", "Roblox sign-in proves the account really is yours, counts your in-game time automatically and works with Roblox's own 2-Step Verification. Google works too, and you can link Roblox later in <b>Settings → Security</b>."], ["What do ranks and permissions do?", "A rank is a set of permissions, such as who can ban, review appeals or host sessions. Ranks also have an optional <b>weekly goal</b> (minutes in game) and an <b>action limit</b>, the most punishments a moderator may hand out per hour."], ["Why should staff link their Roblox account?", "Time in game only counts toward weekly goals when Sentinel knows which Roblox account is yours. Staff who sign in with Roblox are linked already. Google users link from <b>Settings → General</b>."], ["What is a leave of absence?", "Staff can tell the team they will be away. While leave is approved they are not marked as missing their weekly goal."]]], ["Player audit", [["What is Player audit?", "A full profile for any player: recent chat, staff actions, game joins, a playtime heatmap and daily minutes. Use the <b>Widgets</b> button on a profile to show or hide sections."], ["How long is history kept?", "Playtime and joins are kept for about six months. Chat logs are kept for 14 days by default (the owner can pick 7, 14 or 30 days in Settings), then deleted every night. See the Player Notice under <b>Settings → Legal</b>."]]], ["Backups and safety", [["Is there a status page?", "Yes, at <b>/status</b> on this site. It shows whether the website, database, nightly backups and Discord bot are working."], ["Is my workspace backed up?", "Yes. A copy is saved every night and kept for 7 days, and owners can <b>Back up now</b> or download a copy from <b>Settings → Backups</b>. Restoring always makes a safety copy first."], ["I deleted a workspace by mistake.", "Deleted workspaces are kept for 30 days. Send us a message on the <b>Feedback</b> tab with the workspace name and we will bring it back."], ["How do I turn on two-step verification?", "Open <b>Settings → Security</b> and press <b>Turn on</b>. Scan the code with an authenticator app (Google Authenticator, Microsoft Authenticator, 1Password, Authy), type the 6 digits it shows, and save your recovery codes. From then on, signing in asks for a code. Owners can also require it for administrators from the same page."], ["I lost my phone or my recovery codes.", "Sign in and type one of your recovery codes where the 6-digit code goes. Each works once. Then turn two-step off and on again to set up your new phone. With no codes left, ask the person who runs this Sentinel site to reset it from the admin console."], ["Someone got into my account.", "Turn on two-step verification in Settings → Security, replace your game code in Settings → Game, remove people you do not recognise from Team, and tell us on the Feedback tab. Backups let us put your workspace back how it was before the change."]]]];

 if(!f){const pick=await drawer({center:1,title:'New form',sub:'Start from a template. You can change everything after.',ok:false,html:`<div class="tpl">${[['application','team','Staff application','Public link. Accept someone and Sentinel makes them an invite locked to their Roblox account.'],['report','flag','Player report','Public link where players report rule breakers, with evidence.'],['incident','form','Staff incident report','Only your staff can fill it in, from inside Sentinel.'],['blank','plus','Blank form','Build your own from scratch.']].map(([k,i,t,x])=>`<button type="button" data-tpl="${k}"><span class="appi sm">${ic(i)}</span><span><b>${t}</b><span class="sm muted">${x}</span></span></button>`).join('')}</div>`,
   mount(fm){fm.addEventListener('click',e=>{const b=e.target.closest('[data-tpl]');if(!b)return;window._tpl=b.dataset.tpl;$('#dw [data-x]').click()})}});
  const k=window._tpl;window._tpl=null;if(!k)return;f=JSON.parse(JSON.stringify(FORM_TPL[k]));f._new=1}
 const ranks=S.ranks.filter(r=>below(r.pos));let saved=null;
 const v=await drawer({title:f._new?'New form':'Edit form',sub:'People see the questions in this order.',ok:f._new?'Create form':'Save form',noFocus:!f._new,
  html:`<label class="lab">Title</label><input class="inp" name="title" maxlength="80" value="${esc(f.title||'')}" placeholder="Staff application">
  <label class="lab">Description <span class="muted">(optional)</span></label><textarea class="inp" name="desc" rows="2" maxlength="600">${esc(f.desc||'')}</textarea>
  <div class="row" style="gap:10px"><div class="sp"><label class="lab">Who fills it in</label><select class="inp" name="audience"><option value="public" ${f.audience==='public'?'selected':''}>Anyone with the link</option><option value="staff" ${f.audience==='staff'?'selected':''}>Only staff, inside Sentinel</option></select></div>
  <div class="sp"><label class="lab">Type</label><select class="inp" name="kind"><option value="custom" ${f.kind==='custom'?'selected':''}>Form</option><option value="application" ${f.kind==='application'?'selected':''}>Staff application</option><option value="report" ${f.kind==='report'?'selected':''}>Report</option></select></div></div>
  <div id="fkr" ${f.kind==='application'?'':'hidden'}><label class="lab">When you accept an applicant${tip('Sentinel creates an invite for this rank, locked to the Roblox username they gave, and shows it on their private status page.')}</label><select class="inp" name="rank"><option value="">Just mark them accepted</option>${ranks.map(r=>`<option value="${r.id}" ${f.rank===r.id?'selected':''}>Invite them as ${esc(r.name)}</option>`).join('')}</select></div>
  <div class="secl">Questions</div><div id="fq">${f.fields.map(fqRow).join('')}</div><button type="button" class="btn s" data-fq="add">${ic('plus')}Add question</button>`,
  mount(fm){const box=$('#fq',fm);fm.elements.kind.onchange=()=>{$('#fkr',fm).hidden=fm.elements.kind.value!=='application'};
   fm.addEventListener('click',e=>{const b=e.target.closest('[data-fq]');if(!b)return;const r=b.closest('.fqr'),a=b.dataset.fq;
    if(a==='add'){box.insertAdjacentHTML('beforeend',fqRow({type:'short'}));$('.fqr:last-child input',box).focus()}else if(a==='del'){if($$('.fqr',box).length>1)r.remove()}else if(a==='up'&&r.previousElementSibling)box.insertBefore(r,r.previousElementSibling);else if(a==='down'&&r.nextElementSibling)box.insertBefore(r.nextElementSibling,r)});
   fm.addEventListener('change',e=>{if(e.target.dataset.k==='type'){const r=e.target.closest('.fqr');$('[data-k=options]',r).hidden=e.target.value!=='choice'}});
   return()=>({fields:$$('.fqr',box).map(r=>({id:r.dataset.fid||undefined,label:$('[data-k=label]',r).value,type:$('[data-k=type]',r).value,required:$('[data-k=required]',r).checked,options:$('[data-k=options]',r).value}))})},
  check:async v=>{const x=await api('/api/forms',{op:'save',id:f.id,form:{title:v.title,desc:v.desc,audience:v.audience,kind:v.kind,rank:v.kind==='application'?v.rank:'',open:f.open!==false,fields:v.fields}});if(x.error)return x.error;saved=x;return ''}});
 if(v&&saved){FORMS=await api('/api/forms');toast(f._new?'Form created':'Form saved');if(route.tab!=='forms')go('forms/forms');else render()}}
async function frOpen(id){
 const x=FORMS.responses.find(y=>y.id===id);if(!x)return;const F=FORMS.forms.find(f=>f.id===x.form),rk=F&&F.kind==='application'&&F.rank?S.ranks.find(r=>r.id===F.rank):null,open=x.status==='new';let RES=null;
 const html=`<div class="row wrap" style="gap:8px;margin-bottom:6px"><span class="bdg ${open?'wa':x.status==='accepted'?'ok':x.status==='declined'?'er':''}">${{new:'New',accepted:'Accepted',declined:'Declined',reviewed:'Reviewed'}[x.status]}</span><span class="sm muted">${dtime(x.t)}${x.by?' · sent by '+esc(x.by):''}</span>${x.who?`<a class="sm" href="#/player/${x.who.id}">View @${esc(x.who.name)}'s profile</a>`:''}</div>
  <div class="ansl">${x.answers.map(a=>`<div><div class="al">${esc(a.label)}</div><div class="av">${a.value?esc(a.value):'<span class="muted">No answer</span>'}</div></div>`).join('')}</div>
  ${!open?`<div class="secl">Review</div><div class="sm">${esc(x.reviewer||'Staff')} · ${x.reviewed?dtime(x.reviewed):''}</div>${x.reply?`<div class="sm muted" style="margin-top:4px">Message sent: “${esc(x.reply)}”</div>`:''}${x.note?`<div class="notebox" style="margin-top:8px">${esc(x.note)}</div>`:''}`:''}
  ${open&&P('forms.review')?`<div class="secl">Your decision</div><div class="seg" id="frd">${[['accept',rk?'Accept and invite':'Accept'],['decline','Decline'],['reviewed','Mark reviewed']].map(([k,l],i)=>`<button type="button" data-v="${k}" class="${(x.kind==='application'?i===0:k==='reviewed')?'on':''}">${l}</button>`).join('')}</div>
   ${rk?`<p class="xs muted" style="margin:8px 0 0">Accepting creates an invite as <b>${esc(rk.name)}</b>, locked to @${esc(x.who?x.who.name:'?')}. They see it on their status page.</p>`:''}
   ${x.tok!==undefined||!x.byUid?`<label class="lab">Message to them <span class="muted">(optional)</span></label><textarea class="inp" name="reply" rows="2" maxlength="600" placeholder="They see this on their status page"></textarea>`:''}<label class="lab">Staff note <span class="muted">(private)</span></label><input class="inp" name="note" maxlength="300">`:''}`;
 let dec=x.kind==='application'?'accept':'reviewed';
 const v=await drawer({title:x.formTitle,html,ok:open&&P('forms.review')?'Save decision':false,noFocus:1,
  mount(fm){const sg=$('#frd',fm);if(sg)sg.onclick=e=>{const b=e.target.closest('button');if(!b)return;dec=b.dataset.v;$$('button',sg).forEach(y=>y.classList.toggle('on',y===b))};return()=>({dec})},
  check:async v=>{const r=await api('/api/forms',{op:'review',rid:id,decision:v.dec,reply:v.reply||'',note:v.note||''});if(r.error)return r.error;RES=r;return ''}});
 if(v&&RES){FORMS=await api('/api/forms');await loadState();render();toast('Saved');
  if(RES.link){const c=await drawer({center:1,title:'Invite created',sub:'It is locked to their Roblox account and shown on their status page. You can also send it to them yourself.',ok:'Copy link',html:`<div class="skey" style="font-size:12.5px;letter-spacing:0">${esc(RES.link)}</div>`});if(c){try{await navigator.clipboard.writeText(RES.link);toast('Invite link copied')}catch{toast('Select the link and copy it','err')}}}}}
async function formFill(id){const F=FORMS.forms.find(f=>f.id===id);if(!F)return;
 const v=await drawer({title:F.title,sub:esc(F.desc||''),ok:'Send',html:F.fields.map(f=>`<label class="lab">${esc(f.label)}${f.required?' <span style="color:var(--er)">*</span>':''}</label>${f.type==='long'?`<textarea class="inp" name="q_${f.id}" rows="3"></textarea>`:f.type==='choice'||f.type==='yesno'?`<select class="inp" name="q_${f.id}"><option value="">Choose…</option>${(f.type==='yesno'?['Yes','No']:f.options).map(o=>`<option>${esc(o)}</option>`).join('')}</select>`:`<input class="inp" name="q_${f.id}" ${f.type==='number'?'inputmode="decimal"':''} ${f.type==='roblox'?'placeholder="Roblox username"':''}>`}`).join(''),
  check:async v=>{const ans={};for(const f of F.fields)ans[f.id]=v['q_'+f.id]||'';const r=await api('/api/forms',{op:'submit',id,answers:ans});return r.error||''}});
 if(v){toast('Sent to your team');FORMS=await api('/api/forms');render()}}
async function entView(uid,id){
 const r=await api(`/api/entry?userId=${uid}&id=${encodeURIComponent(id)}`);if(bad(r))return;const e=r.entry,host=u=>{try{return new URL(u).hostname.replace(/^www\./,'')}catch{return 'link'}};
 const html=`<dl class="kv2"><dt>Entry</dt><dd><span class="bdg ${LTYPE[e.type]||''}">${esc(e.type)}</span></dd>${e.type==='Note'||e.type==='Points'||e.type==='Unmuted'||e.type==='Unbanned'?'':`<dt>Status</dt><dd>${entSt(e)}</dd>`}<dt>Player</dt><dd>${esc(e.name)}</dd><dt>When</dt><dd>${dtime(e.time)}</dd><dt>By</dt><dd>${esc(e.by||'—')}</dd>${e.machine?`<dt>Machine ban</dt><dd>Roblox alt detection${e.machineErr?` <div class="sm" style="color:var(--er)">Failed: ${esc(e.machineErr)}. The normal ban still applies.</div>`:''}</dd>`:''}${e.minutes?`<dt>Length</dt><dd>${fmin(e.minutes)}</dd>`:''}<dt>Reason</dt><dd>${esc(e.reason||'—')}</dd></dl>
  ${e.note?`<div class="secl">Private note</div><div class="notebox">${esc(e.note)}</div>`:''}
  ${e.ev&&e.ev.length?`<div class="secl">Evidence</div><div class="evl">${e.ev.map(u=>`<a href="${esc(u)}" target="_blank" rel="noopener noreferrer nofollow"><b>${esc(host(u))}</b><span class="muted">${esc(u.replace(/^https?:\/\/[^/]+/,'').slice(0,80))}</span></a>`).join('')}</div><p class="xs muted" style="margin:2px 0 0">Links open other websites. Only open ones you trust.</p>`:''}
   ${e.boxes&&e.boxes.length?`<div class="secl">Chat logs</div><div class="row wrap" style="gap:6px">${e.boxes.map(id=>`<button type="button" class="btn s" data-a="cl-open" data-id="${esc(id)}">${ic('chat')}<span class="mono">${esc(id)}</span></button>`).join('')}</div>`:''}
   ${e.ctx&&e.ctx.length?`<div class="secl">What they said before this</div><div class="ctxl">${e.ctx.map(m=>`<div><time>${new Date(m.t).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})}</time><span>${esc(m.text)}</span></div>`).join('')}</div>`:''}
  ${!e.note&&!(e.ev&&e.ev.length)&&!(e.ctx&&e.ctx.length)&&!(e.boxes&&e.boxes.length)?'<p class="sm muted" style="margin-top:14px">No evidence was attached.</p>':''}
  ${P('logbook.note')?`<div class="secl">Add evidence</div><input class="inp" name="url" placeholder="https:// link to a clip or screenshot"><input class="inp" name="note" maxlength="500" placeholder="Or a note for staff" style="margin-top:8px">`:''}
  ${MODT[e.type]&&(P('reports.handle')||P('staff.review'))?`<div class="row wrap" style="gap:8px;margin-top:14px">${sendUpBtn('entry',{userId:uid,entryId:e.id})}${P('staff.review')?`<button type="button" class="btn s ${e.train?'pri':''}" data-a="tr-mark" data-uid="${uid}" data-id="${esc(e.id)}" data-v="${e.train?0:1}">${e.train?'Used for training':'Use for training'}</button>`:''}</div>${P('staff.review')?'<p class="xs muted" style="margin-top:6px">Training cases show only the reason, with names removed. Marking this entry also lets trainees see its chat and private note, anonymised.</p>':''}`:''}`;
 const v=await drawer({title:'Record details',html,ok:P('logbook.note')?'Add evidence':false,noFocus:1,check:async v=>{if(!String(v.url||'').trim()&&!String(v.note||'').trim())return 'Add a link or a note first';const x=await api('/api/entry',{op:'evidence',userId:uid,id,url:String(v.url||'').trim(),note:v.note||''});return x.error||''}});
 if(v){toast('Evidence added');if(PROF&&String(PROF.userId)===String(uid))await pageData();render();entView(uid,id)}}

/* ============ start ============ */
setInterval(()=>{if(route.page==='player'||route.page==='reports'||route.page==='servers')pollLive()},3000);
setInterval(async()=>{if(document.hidden)return;if(ME&&ME.maint){const m=await fetch('/api/me').then(r=>r.json()).catch(()=>null);if(m&&!m.maint)location.reload()}else if(BLOCK){const r=await fetch('/api/state').then(r=>r.json()).catch(()=>({code:BLOCK.code}));if(r.code!==BLOCK.code)location.reload()}},30000);
setInterval(async()=>{if(route.page==='player'||route.page==='reports')return;if(document.hidden||!S||!ME||!ME.user||OB||JOIN||dwOpen()||CK||$('#mn .menu'))return;const ae=document.activeElement;if(ae&&/^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName))return;await loadState();if(S)render()},6000);
(async()=>{try{render();route=parse();if(route.page==='join'||route.page==='gjoin'){await loadMe();await onRoute();LOADED=true;return}
 await loadMe();let gj=null;try{gj=sessionStorage.getItem('gj')}catch{}if(gj&&ME.user){LOADED=true;location.hash='#/g/'+gj;return}
 if(route.linked){toast('Roblox account linked');history.replaceState(null,'','#/');route={page:'home'}}
 if(ME.user&&ME.workspaces.length){await loadState();if(route.page==='setup'&&S&&S.me.owner)OB={step:'script'};await pageData()}}catch(e){console.error(e);LASTERR=LASTERR||String(e.message||e)}LOADED=true;render(true);setTimeout(async()=>{await alphaNotice();whatsNew(tour())},900)})();
