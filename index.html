<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Sentinel</title>
<script>
  window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
</script>
<script defer src="/_vercel/insights/script.js"></script>
<style>
:root{
  --bg:#f5f5f7;--card:#fff;--ink:#1d1d1f;--muted:#6e6e73;--faint:#a1a1a6;--line:rgba(0,0,0,.09);--fill:rgba(120,120,128,.16);--fill2:rgba(120,120,128,.09);
  --blue:#0071e3;--blue-ink:#fff;--tint:rgba(0,113,227,.11);--green:#30a14e;--red:#e5342b;--orange:#d97706;--sidebar:rgba(250,250,252,.66);
  --shadow:0 1px 1px rgba(0,0,0,.03),0 6px 22px rgba(0,0,0,.06);--shadow-lg:0 24px 70px rgba(0,0,0,.22);
  --wall:radial-gradient(900px 600px at 8% 0%,#cfe0ff 0,transparent 60%),radial-gradient(800px 600px at 0% 100%,#f3d6ff 0,transparent 55%),#eef1f8;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Segoe UI Variable Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
@media(prefers-color-scheme:dark){:root{
  --bg:#000;--card:#1c1c1e;--ink:#f5f5f7;--muted:#98989f;--faint:#636366;--line:rgba(255,255,255,.12);--fill:rgba(120,120,128,.36);--fill2:rgba(120,120,128,.2);
  --blue:#0a84ff;--tint:rgba(10,132,255,.2);--green:#32d74b;--red:#ff453a;--orange:#ff9f0a;--sidebar:rgba(36,36,40,.62);
  --shadow:0 0 0 .5px rgba(255,255,255,.06),0 8px 28px rgba(0,0,0,.5);--shadow-lg:0 24px 70px rgba(0,0,0,.7);
  --wall:radial-gradient(900px 600px at 8% 0%,#1b2d57 0,transparent 60%),radial-gradient(800px 600px at 0% 100%,#3a1d52 0,transparent 55%),#0b0b0f;}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;font:15px/1.45 var(--font);color:var(--ink);background:var(--wall) fixed;-webkit-font-smoothing:antialiased;letter-spacing:-.011em}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
a{color:var(--blue);text-decoration:none}a:hover{text-decoration:underline}
h1{font-size:34px;line-height:1.1;letter-spacing:-.03em;margin:0;font-weight:700}
h2{font-size:20px;letter-spacing:-.02em;margin:0;font-weight:650}
h3{font-size:15px;margin:0;font-weight:600}
.sub{color:var(--muted);margin:6px 0 0;font-size:16px}
.muted{color:var(--muted)}.fine{font-size:12.5px;color:var(--muted)}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---------- shell ---------- */
#shell{display:grid;grid-template-columns:252px 1fr;height:100vh;height:100dvh}
.sb{display:flex;flex-direction:column;gap:6px;padding:14px 12px 12px;background:var(--sidebar);backdrop-filter:saturate(190%) blur(34px);-webkit-backdrop-filter:saturate(190%) blur(34px);border-right:1px solid var(--line);position:relative;z-index:5}
.wsw{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border-radius:10px;text-align:left;font-weight:600}
.wsw:hover{background:var(--fill2)}.wsw .wname{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.appicon{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:#fff;background:linear-gradient(160deg,#4da3ff,#0a5bd6);box-shadow:inset 0 0 0 .5px rgba(255,255,255,.35),0 2px 6px rgba(10,91,214,.35);flex:none}
.appicon.sm{width:28px;height:28px;border-radius:7px}.appicon.sm svg{width:15px;height:15px}.appicon.lg{width:76px;height:76px;border-radius:19px}.appicon.lg svg{width:38px;height:38px;stroke-width:1.6}
nav{display:flex;flex-direction:column;gap:2px;margin-top:6px}
.nv{display:flex;align-items:center;gap:11px;padding:8px 11px;border-radius:9px;font-weight:500;color:var(--ink);text-align:left;position:relative}
.nv svg{color:var(--blue)}.nv:hover{background:var(--fill2)}.nv.on{background:var(--tint);color:var(--blue);font-weight:600}
.nv .bd{margin-left:auto;background:var(--red);color:#fff;border-radius:99px;font-size:11.5px;font-weight:600;min-width:19px;height:19px;display:grid;place-items:center;padding:0 6px}
.sbfoot{margin-top:auto;display:flex;flex-direction:column;gap:8px}
.conn{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);padding:6px 10px;border-radius:99px;background:var(--fill2)}
.conn i{width:8px;height:8px;border-radius:50%;background:var(--faint)}.conn.on i{background:var(--green);box-shadow:0 0 0 3px rgba(48,209,88,.2)}
.me{display:flex;align-items:center;gap:10px;padding:6px 6px 6px 8px}.me>div{flex:1;min-width:0;line-height:1.2}.me b{display:block;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.me small{color:var(--muted);font-size:12px}
.ico{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--muted)}.ico:hover{background:var(--fill2);color:var(--ink)}
.av{width:32px;height:32px;border-radius:50%;background:linear-gradient(160deg,#8e8e93,#636366);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:600;flex:none;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}.av.lg{width:46px;height:46px;font-size:15px}.av.xl{width:64px;height:64px;font-size:20px}
.menu{position:fixed;left:12px;width:228px;top:58px;background:var(--card);border-radius:14px;box-shadow:var(--shadow-lg);border:1px solid var(--line);padding:6px;z-index:20}
.menu button{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border-radius:8px;text-align:left}.menu button:hover{background:var(--tint);color:var(--blue)}
.menu hr{border:0;border-top:1px solid var(--line);margin:6px 4px}.menu .ck{margin-left:auto;color:var(--blue)}
main{overflow:auto;padding:34px 40px 60px;background:var(--bg)}
.wrap{max-width:980px;margin:0 auto}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.mhead{display:none}

/* ---------- parts ---------- */
.card{background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:20px 22px}
.card.tight{padding:6px 0}
.grid{display:grid;gap:16px}.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.gh{grid-template-columns:1.5fr 1fr}
.mt{margin-top:18px}.mt2{margin-top:30px}.row{display:flex;align-items:center;gap:12px}.sp{flex:1}.wrapf{flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:36px;padding:0 16px;border-radius:10px;background:var(--blue);color:#fff;font-weight:600;font-size:14.5px;transition:.15s;white-space:nowrap;text-decoration:none}
.btn:hover{filter:brightness(1.08);text-decoration:none}.btn:active{transform:scale(.98)}
.btn.gray{background:var(--fill);color:var(--ink)}.btn.gray:hover{filter:brightness(.96)}
.btn.red{background:var(--red)}.btn.sm{height:30px;padding:0 12px;font-size:13.5px;border-radius:8px}.btn.lg{height:46px;padding:0 24px;font-size:16px;border-radius:12px}
.btn.plain{background:none;color:var(--blue);padding:0 8px}.btn[disabled]{opacity:.45;pointer-events:none}
.seg{display:inline-flex;background:var(--fill);padding:2px;border-radius:10px;gap:2px;max-width:100%;overflow:auto}
.seg button{padding:6px 16px;border-radius:8px;font-weight:500;font-size:14px;color:var(--ink);white-space:nowrap}
.seg button.on{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.18);font-weight:600}
@media(prefers-color-scheme:dark){.seg button.on{background:#636366}}
.field{width:100%;height:40px;padding:0 13px;border-radius:10px;border:1px solid var(--line);background:var(--card);outline:0;transition:.15s}
textarea.field{height:auto;min-height:84px;padding:10px 13px;resize:vertical}
.field:focus{border-color:var(--blue);box-shadow:0 0 0 4px var(--tint)}
.lab{display:block;font-size:13px;font-weight:600;margin:0 0 6px}.help{font-size:12.5px;color:var(--muted);margin-top:5px}
.pill{display:inline-flex;align-items:center;height:22px;padding:0 9px;border-radius:99px;font-size:12px;font-weight:600;background:var(--fill2);color:var(--muted)}
.pill.open{background:rgba(255,59,48,.13);color:var(--red)}.pill.claimed{background:rgba(255,159,10,.16);color:var(--orange)}.pill.resolved,.pill.ok{background:rgba(48,209,88,.16);color:var(--green)}.pill.blue{background:var(--tint);color:var(--blue)}
.list>*{padding:13px 22px;display:flex;align-items:center;gap:14px}.list>*+*{border-top:1px solid var(--line)}
.list .t{flex:1;min-width:0}.list .t>b{font-weight:600;display:block}.list .t span{color:var(--muted);font-size:13.5px}
.empty{text-align:center;color:var(--muted);padding:44px 20px}.empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:4px}
.stat b{display:block;font-size:34px;letter-spacing:-.03em;line-height:1.1}.stat span{color:var(--muted);font-size:13.5px}
.hero{background:linear-gradient(150deg,#0a84ff,#5e5ce6);color:#fff;position:relative;overflow:hidden}
.hero .stat span{color:rgba(255,255,255,.8)}.hero b{font-size:56px}
.spark{position:absolute;left:0;right:0;bottom:0;width:100%;height:70px;opacity:.9}.spark .sf{fill:rgba(255,255,255,.18)}.spark .sl{fill:none;stroke:rgba(255,255,255,.9);stroke-width:2;vector-effect:non-scaling-stroke}
.sw{position:relative;width:46px;height:28px;border-radius:14px;background:var(--fill);transition:.2s;flex:none}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.3);transition:.2s}
.sw.on{background:var(--green)}.sw.on::after{transform:translateX(18px)}
.pc{display:flex;gap:14px;align-items:center}.pc .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.bar{height:8px;border-radius:99px;background:var(--fill2);overflow:hidden}.bar>i{display:block;height:100%;background:var(--blue);border-radius:99px}.bar.done>i{background:var(--green)}
table{width:100%;border-collapse:collapse}td,th{padding:11px 22px;text-align:left;border-top:1px solid var(--line)}th{border:0;color:var(--muted);font-size:12.5px;font-weight:600;padding-top:14px}
.chat{font-size:14px}.chat .ln{padding:9px 22px;display:flex;gap:10px;align-items:baseline}.chat .ln+.ln{border-top:1px solid var(--line)}.chat .ln.fl{background:rgba(255,159,10,.12)}
.chat .ln .a{opacity:0;transition:.15s;margin-left:auto;display:flex;gap:6px}.chat .ln:hover .a{opacity:1}
code{background:var(--fill2);border-radius:6px;padding:2px 6px;font:13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.key{font:14px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:0}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{background:var(--fill2);border-radius:99px;padding:3px 11px;font-size:13px}
.callchat{background:var(--fill2);border-radius:12px;padding:10px 14px;font-size:13.5px;margin-top:10px}.callchat div+div{margin-top:3px}
.hl{color:var(--orange);font-weight:600}

/* ---------- auth + onboarding ---------- */
.center{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:24px;position:relative}
.auth-card{width:100%;max-width:400px;text-align:center;background:var(--sidebar);backdrop-filter:saturate(190%) blur(40px);-webkit-backdrop-filter:saturate(190%) blur(40px);border:1px solid var(--line);border-radius:28px;padding:44px 36px 30px;box-shadow:var(--shadow-lg)}
.auth-card .appicon{margin:0 auto 20px}.auth-card h1{font-size:30px}.auth-card .sub{font-size:15.5px;margin-bottom:26px}
.oauth{display:flex;align-items:center;justify-content:center;gap:11px;height:50px;border-radius:13px;font-weight:600;font-size:16px;background:var(--card);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line);margin-top:10px;text-decoration:none!important;transition:.15s}
.oauth:hover{transform:translateY(-1px);box-shadow:inset 0 0 0 1px var(--line),0 6px 16px rgba(0,0,0,.1)}.oauth svg{width:20px;height:20px}
.oauth.dark{background:#1d1d1f;color:#fff;box-shadow:none;--rbx:#1d1d1f}@media(prefers-color-scheme:dark){.oauth.dark{background:#f5f5f7;color:#1d1d1f;--rbx:#f5f5f7}}
.invite{background:var(--tint);color:var(--blue);border-radius:12px;padding:11px 14px;font-size:14px;margin:-6px 0 18px;font-weight:500}
.legal{display:flex;gap:16px;justify-content:center;margin-top:20px;font-size:12.5px}.legal a{color:var(--muted)}
.fixedlegal{position:absolute;bottom:20px;left:0;right:0;margin:0}
.ob{width:100%;max-width:540px}.dots{display:flex;gap:7px;justify-content:center;margin-bottom:26px}.dots i{width:7px;height:7px;border-radius:50%;background:var(--fill)}.dots i.on{background:var(--blue);width:22px;border-radius:99px}
.ob h1{font-size:32px;text-align:center}.ob .sub{text-align:center;margin-bottom:26px}
.steps{display:grid;gap:10px;text-align:left}.stp{display:flex;gap:14px;background:var(--card);border-radius:16px;padding:15px 16px;box-shadow:var(--shadow)}
.stp .n{width:26px;height:26px;border-radius:50%;background:var(--tint);color:var(--blue);display:grid;place-items:center;font-weight:700;font-size:13px;flex:none;margin-top:1px}
.stp>div>b{display:block}.stp span{color:var(--muted);font-size:14px}.stp span b{color:var(--ink);font-weight:600}
.status{width:92px;height:92px;border-radius:50%;margin:0 auto 20px;display:grid;place-items:center;background:var(--fill2);color:var(--muted)}
.status.ok{background:rgba(48,209,88,.16);color:var(--green)}.status svg{width:40px;height:40px;stroke-width:2}
.spin{width:34px;height:34px;border-radius:50%;border:3.5px solid var(--fill);border-top-color:var(--blue);animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}

/* ---------- sheet + toast ---------- */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.32);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);z-index:50;animation:fd .15s}
.sheet{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(440px,calc(100vw - 32px));max-height:calc(100vh - 40px);overflow:auto;background:var(--card);border-radius:22px;box-shadow:var(--shadow-lg);padding:26px;z-index:51;animation:pp .22s cubic-bezier(.2,.9,.3,1.2)}
.sheet h2{margin-bottom:6px}.sheet .fl{display:grid;gap:14px;margin:18px 0 22px}.sheet .bt{display:flex;gap:10px;justify-content:flex-end}
@keyframes fd{from{opacity:0}}@keyframes pp{from{opacity:0;transform:translate(-50%,-46%) scale(.96)}}
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:80;display:grid;gap:8px;justify-items:center;pointer-events:none}
.toast{background:rgba(30,30,32,.9);color:#fff;backdrop-filter:blur(20px);padding:11px 18px;border-radius:99px;font-size:14px;font-weight:500;box-shadow:0 8px 30px rgba(0,0,0,.3);animation:tp .25s}.toast.err{background:rgba(200,40,30,.95)}
@keyframes tp{from{opacity:0;transform:translateY(10px)}}

@media(max-width:860px){
  #shell{display:block}main{height:100dvh;padding:18px 16px calc(92px + env(safe-area-inset-bottom))}
  .sb{position:fixed;left:0;right:0;bottom:0;top:auto;flex-direction:row;padding:6px 8px calc(6px + env(safe-area-inset-bottom));border-right:0;border-top:1px solid var(--line);z-index:30}
  .sb .wsw,.sb .sbfoot{display:none}.sb nav{flex-direction:row;width:100%;margin:0;justify-content:space-around}
  .nv{flex-direction:column;gap:2px;font-size:11px;padding:6px 10px;background:none!important}.nv .bd{position:absolute;top:0;right:2px;min-width:16px;height:16px;font-size:10px}
  .mhead{display:flex;align-items:center;gap:10px;margin-bottom:14px}.mhead .wsw{width:auto;flex:1}
  .menu{top:62px;left:12px;right:12px;width:auto}.g2,.g3,.g4,.gh{grid-template-columns:1fr}h1{font-size:30px}.hero b{font-size:46px}
  .g4,.gh .g2{grid-template-columns:1fr 1fr}.list>*{padding:12px 16px}td,th{padding:10px 12px}
}
</style>
</head>
<body>
<div id="root"></div><div id="sheet"></div><div id="toast"></div>
<script>
"use strict";
const $=(s,e=document)=>e.querySelector(s),$$=(s,e=document)=>[...e.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ago=t=>{const s=Math.max(0,(Date.now()-t)/1000|0);return s<5?'just now':s<60?s+'s ago':s<3600?(s/60|0)+'m ago':s<86400?(s/3600|0)+'h ago':(s/86400|0)+'d ago'};
const dur=sec=>{const m=Math.round(sec/60);return m<60?m+'m':(m/60|0)+'h '+(m%60)+'m'};
const initials=n=>String(n||'?').trim().split(/\s+/).slice(0,2).map(w=>w[0]||'').join('').toUpperCase()||'?';
const RANK={helper:1,moderator:2,admin:3};
const IC={
 shield:'<path d="M12 3l8 3v6c0 4.5-3.2 8-8 9-4.8-1-8-4.5-8-9V6z"/>',home:'<path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9.5h13V10"/>',
 players:'<circle cx="9" cy="8" r="3.2"/><path d="M3 19c.8-3.2 3.3-5 6-5s5.2 1.8 6 5"/><circle cx="17.5" cy="9" r="2.4"/><path d="M16.5 14.2c2.3.2 4 1.6 4.5 4.3"/>',
 reports:'<path d="M5 21V4"/><path d="M5 5h11l-2 3.5 2 3.5H5"/>',activity:'<path d="M3 13h4l3-8 4 15 3-7h4"/>',
 settings:'<path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/>',
 chev:'<path d="M7 10l5 5 5-5"/>',check:'<path d="M5 12.5l4.5 4.5L19 7.5"/>',plus:'<path d="M12 5v14M5 12h14"/>',out:'<path d="M14 4h4a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-4"/><path d="M10 8l-4 4 4 4M6 12h10"/>',
 bolt:'<path d="M13 3L5 13.5h6L10 21l8-10.5h-6z"/>'};
const svg=n=>`<svg class="i" viewBox="0 0 24 24">${IC[n]}</svg>`;
const GOOGLE='<svg viewBox="0 0 24 24"><path fill="#4285F4" d="M23 12.27c0-.8-.07-1.56-.2-2.3H12v4.35h6.18a5.28 5.28 0 0 1-2.3 3.47v2.88h3.7C21.75 18.7 23 15.7 23 12.27z"/><path fill="#34A853" d="M12 23.5c3.1 0 5.7-1.03 7.6-2.8l-3.7-2.88c-1.03.7-2.35 1.1-3.9 1.1-3 0-5.5-2.02-6.4-4.73H1.8v2.97A11.5 11.5 0 0 0 12 23.5z"/><path fill="#FBBC05" d="M5.6 14.2a6.9 6.9 0 0 1 0-4.4V6.83H1.8a11.5 11.5 0 0 0 0 10.34z"/><path fill="#EA4335" d="M12 5.07c1.7 0 3.2.58 4.4 1.73l3.3-3.3C17.7 1.6 15.1.5 12 .5 7.5.5 3.7 3 1.8 6.83L5.6 9.8C6.5 7.1 9 5.07 12 5.07z"/></svg>';
const ROBLOX='<svg viewBox="0 0 24 24"><g transform="rotate(14 12 12)"><rect x="4" y="4" width="16" height="16" rx="2.6" fill="currentColor"/><rect x="9.6" y="9.6" width="4.8" height="4.8" rx=".8" fill="var(--rbx,#1d1d1f)"/></g></svg>';

let ME=null,S=null,SETUP=null,JOIN=null,OB=null,found=null,menuOpen=false,page='home',busy=false;
const tab={players:'online',reports:'calls',activity:'sessions',settings:'game'};
const AV={},AVQ=new Set();
const can=n=>!!S&&RANK[S.me.role]>=n;
const roleLabel=()=>S.me.owner?'Owner':S.me.role[0].toUpperCase()+S.me.role.slice(1);

/* ---------- plumbing ---------- */
function toast(msg,kind){const t=document.createElement('div');t.className='toast'+(kind?' '+kind:'');t.textContent=msg;$('#toast').append(t);setTimeout(()=>t.remove(),3200)}
async function api(path,body){
  let r;try{r=await fetch(path,body!==undefined?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}:{})}catch{toast('No connection. Check your internet.','err');return{error:'offline',_s:0}}
  let j={};try{j=await r.json()}catch{}
  if(typeof j!=='object'||!j)j={};j._s=r.status;
  if(r.status===429)toast(j.error||'Slow down for a moment.','err');
  else if(r.status===401&&ME&&ME.user){ME.user=null;S=null;render()}
  return j}
const fail=r=>{if(r.error&&r._s!==429)toast(r.error,'err');return!!r.error};
async function loadMe(){ME=await api('/api/me');return ME}
async function loadState(){
  S=await api('/api/state');
  if(S.code==='no_workspace'){await loadMe();S=ME.current?await api('/api/state'):null}
  if(S&&S.error)S=null}
async function refresh(){await loadState();render()}

function sheet(o){return new Promise(res=>{
  const w=$('#sheet');const f=(o.fields||[]).map(x=>`<div><label class="lab" for="sf_${x.name}">${esc(x.label)}</label>${
    x.type==='select'?`<select class="field" id="sf_${x.name}" name="${x.name}">${x.options.map(([v,t])=>`<option value="${esc(v)}"${v==x.value?' selected':''}>${esc(t)}</option>`).join('')}</select>`:
    x.type==='textarea'?`<textarea class="field" id="sf_${x.name}" name="${x.name}" placeholder="${esc(x.placeholder||'')}">${esc(x.value||'')}</textarea>`:
    `<input class="field" id="sf_${x.name}" name="${x.name}" type="${x.type||'text'}" value="${esc(x.value??'')}" placeholder="${esc(x.placeholder||'')}" ${x.required?'required':''} autocomplete="off">`}${x.help?`<div class="help">${esc(x.help)}</div>`:''}</div>`).join('');
  w.innerHTML=`<div class="scrim"></div><form class="sheet" role="dialog" aria-modal="true"><h2>${esc(o.title)}</h2>${o.text?`<p class="muted" style="margin:6px 0 0">${esc(o.text)}</p>`:''}<div class="fl">${f}</div><div class="bt"><button type="button" class="btn gray" data-x="cancel">Cancel</button><button class="btn${o.danger?' red':''}">${esc(o.ok||'OK')}</button></div></form>`;
  const close=v=>{w.innerHTML='';document.removeEventListener('keydown',kd);res(v)};
  const kd=e=>{if(e.key==='Escape')close(null)};document.addEventListener('keydown',kd);
  $('.scrim',w).onclick=()=>close(null);$('[data-x=cancel]',w).onclick=()=>close(null);
  $('form',w).onsubmit=e=>{e.preventDefault();const v={};new FormData(e.target).forEach((x,k)=>v[k]=x);close(v)};
  const first=$('input,select,textarea',w);if(first)first.focus()})}
const sheetOpen=()=>!!$('#sheet .sheet');

function avatar(id,name,cls=''){const u=AV[id];if(!u&&id)AVQ.add(id);return `<span class="av ${cls}" data-uid="${id||''}">${u?`<img src="${esc(u)}" alt="">`:esc(initials(name))}</span>`}
async function fillAvatars(){
  const ids=[...AVQ].filter(i=>!(i in AV)).slice(0,60);AVQ.clear();
  if(ids.length&&S){const r=await api('/api/avatars?ids='+ids.join(','));ids.forEach(i=>AV[i]=r[i]||'')}
  $$('.av[data-uid]').forEach(e=>{const u=AV[e.dataset.uid];if(u&&!e.querySelector('img'))e.innerHTML=`<img src="${esc(u)}" alt="">`})}

/* ---------- screens ---------- */
function render(){
  const root=$('#root');
  if(!ME){root.innerHTML='<div class="center"><div class="spin"></div></div>';return}
  if(!ME.user)root.innerHTML=authScreen();
  else if(JOIN)root.innerHTML=joinScreen();
  else if(OB||!ME.workspaces.length)root.innerHTML=onboarding();
  else if(!S)root.innerHTML='<div class="center"><div class="spin"></div></div>';
  else{const keep=$('#main')&&page===root.dataset.page?$('#main').scrollTop:0;root.innerHTML=shell();root.dataset.page=page;if(keep)$('#main').scrollTop=keep}
  fillAvatars()}

function authScreen(){
  const has=k=>ME.providers.includes(k),inv=JOIN&&JOIN.code?'?invite='+JOIN.code:'';
  return `<div class="center"><div class="auth-card"><div class="appicon lg">${svg('shield')}</div><h1>Sentinel</h1><p class="sub">Keep your Roblox game friendly.<br>Moderation that just works.</p>
  ${JOIN&&JOIN.info?`<div class="invite">You're invited to join <b>${esc(JOIN.info.workspace)}</b> as ${esc(JOIN.info.role)}.</div>`:''}${JOIN&&JOIN.err?`<div class="invite" style="background:rgba(255,59,48,.12);color:var(--red)">${esc(JOIN.err)}</div>`:''}
  ${has('google')?`<a class="oauth" href="/auth/google${inv}">${GOOGLE}Continue with Google</a>`:''}${has('roblox')?`<a class="oauth dark" href="/auth/roblox${inv}">${ROBLOX}Continue with Roblox</a>`:''}
  <p class="fine" style="margin:20px 0 0">By continuing you agree to the <a href="/legal/terms" target="_blank">Terms</a> and <a href="/legal/privacy" target="_blank">Privacy Policy</a>. You must be 13 or older.</p></div>
  <div class="legal fixedlegal"><a href="/legal/privacy" target="_blank">Privacy</a><a href="/legal/terms" target="_blank">Terms</a><a href="/legal/cookies" target="_blank">Cookies</a></div></div>`}

function joinScreen(){
  if(!JOIN.info)return `<div class="center"><div class="auth-card"><h1 style="font-size:24px">Invite not valid</h1><p class="sub">${esc(JOIN.err||'This invite has expired or was already used.')}</p><button class="btn gray lg" style="width:100%" data-a="join-cancel">Continue</button></div></div>`;
  return `<div class="center"><div class="auth-card"><div class="appicon lg">${svg('players')}</div><h1 style="font-size:26px">Join ${esc(JOIN.info.workspace)}</h1><p class="sub">You'll join as <b>${esc(JOIN.info.role)}</b>, signed in as ${esc(ME.user.name)}.</p>
  <button class="btn lg" style="width:100%" data-a="join-accept">Join workspace</button><button class="btn plain" style="margin-top:12px" data-a="join-cancel">Not now</button></div></div>`}

function onboarding(){
  OB=OB||{step:1};const st=OB.step,first=esc(ME.user.name.split(' ')[0]);
  const dots=`<div class="dots">${[1,2,3].map(i=>`<i class="${i<=st?'on':''}"></i>`).join('')}</div>`;
  let inner='';
  if(st===1)inner=`<h1>Welcome, ${first}</h1><p class="sub">Let's set up Sentinel for your game.<br>It takes about two minutes.</p>
   <form data-f="ob-name" class="card" style="padding:26px"><label class="lab" for="obn">What's your game called?</label><input id="obn" class="field" name="name" maxlength="40" placeholder="My Roblox Game" autocomplete="off" value="${esc(OB.name||'')}" required>
   <div class="help">This is just a label for you and your team. You can change it later.</div><button class="btn lg" style="width:100%;margin-top:20px">Continue</button></form>
   ${ME.workspaces.length?`<p style="text-align:center;margin-top:14px"><button class="btn plain" data-a="ob-cancel">Cancel</button></p>`:`<p style="text-align:center;margin-top:14px"><button class="btn plain" data-a="signout">Sign out</button></p>`}`;
  else if(st===2)inner=`<h1>Add Sentinel to your game</h1><p class="sub">Three quick steps in Roblox Studio.</p><div class="steps">
   <div class="stp"><div class="n">1</div><div><b>Create a Script</b><span>In Explorer, hover <b>ServerScriptService</b>, click <b>+</b> and choose <b>Script</b>.</span></div></div>
   <div class="stp"><div class="n">2</div><div style="flex:1"><b>Paste our code</b><span>Delete what's inside and paste this. It already contains your game's private key.</span>
     <div class="row wrapf" style="margin-top:10px"><button class="btn sm" data-a="copy-script">Copy script</button><a class="btn sm gray" href="/api/bridge?download=1">Download .lua</a></div></div></div>
   <div class="stp"><div class="n">3</div><div><b>Allow HTTP requests</b><span>Home, then <b>Game Settings</b>, then <b>Security</b>. Turn on <b>Allow HTTP Requests</b>.</span></div></div></div>
   <button class="btn lg" style="width:100%;margin-top:20px" data-a="ob-next">I've done this</button>`;
  else inner=`<div class="status ${OB.ok?'ok':''}">${OB.ok?`<svg class="i" viewBox="0 0 24 24">${IC.check}</svg>`:'<div class="spin"></div>'}</div>
   <h1>${OB.ok?"You're connected":'Waiting for your game'}</h1><p class="sub">${OB.ok?'Sentinel can now see your players and moderate in real time.':'Press <b>Play</b> in Roblox Studio. This page updates by itself.'}</p>
   <button class="btn lg" style="width:100%" data-a="ob-done" ${OB.ok?'':'disabled'}>Open Sentinel</button>
   ${OB.ok?'':'<p style="text-align:center;margin-top:14px"><button class="btn plain" data-a="ob-done">Skip for now</button></p>'}`;
  return `<div class="center"><div class="ob">${dots}${inner}</div></div>`}

function shell(){
  const nav=[['home','Home'],['players','Players'],['reports','Reports'],['activity','Activity'],['settings','Settings']];
  const menu=menuOpen?`<div class="menu">${ME.workspaces.map(w=>`<button data-a="ws-switch" data-id="${w.id}">${esc(w.name)}${w.id===S.workspace.id?`<span class="ck">${svg('check')}</span>`:''}</button>`).join('')}<hr>${ME.workspaces.length<ME.maxPerUser?`<button data-a="ws-new">${svg('plus')}New workspace</button>`:''}<button data-a="signout">${svg('out')}Sign out</button></div>`:'';
  const sw=`<button class="wsw" data-a="wsmenu" aria-haspopup="true"><span class="appicon sm">${svg('shield')}</span><span class="wname">${esc(S.workspace.name)}</span>${svg('chev')}</button>`;
  return `<div id="shell"><aside class="sb">${sw}<nav>${nav.map(([k,t])=>`<button class="nv ${page===k?'on':''}" data-a="nav" data-id="${k}">${svg(k)}${t}${k==='reports'&&S.openCalls?`<span class="bd">${S.openCalls}</span>`:''}</button>`).join('')}</nav>
   <div class="sbfoot"><div class="conn ${S.connected?'on':''}"><i></i>${S.connected?`Game online${S.servers>1?' · '+S.servers+' servers':''}`:'Waiting for game'}</div>
   <div class="me">${avatar('',S.me.name)}<div><b>${esc(S.me.name)}</b><small>${roleLabel()}</small></div><button class="ico" data-a="signout" title="Sign out" aria-label="Sign out">${svg('out')}</button></div></div></aside>
   <main id="main"><div class="wrap"><div class="mhead">${sw}</div>${PAGES[page]()}</div></main>${menu}</div>`}

const seg=(key,items)=>`<div class="seg" role="tablist">${items.map(([k,t])=>`<button class="${tab[key]===k?'on':''}" data-a="tab" data-k="${key}" data-id="${k}">${t}</button>`).join('')}</div>`;
const head=(t,s,right='')=>`<div class="head"><div><h1>${t}</h1>${s?`<p class="sub">${s}</p>`:''}</div>${right}</div>`;
const spark=v=>{if(v.length<2)v=[0,v[0]||0];const W=300,H=70,m=Math.max(1,...v),d=v.map((x,i)=>(i?'L':'M')+(i/(v.length-1)*W).toFixed(1)+' '+(H-6-x/m*(H-22)).toFixed(1)).join(' ');return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><path class="sf" d="${d} L${W} ${H} L0 ${H}Z"/><path class="sl" d="${d}"/></svg>`};
const empty=(t,s)=>`<div class="empty"><b>${t}</b>${s||''}</div>`;
const pActs=p=>`<div class="acts">${can(1)?`<button class="btn sm gray" data-a="act" data-do="warn" data-uid="${p.userId}" data-n="${esc(p.name)}">Warn</button><button class="btn sm gray" data-a="act" data-do="kick" data-uid="${p.userId}" data-n="${esc(p.name)}">Kick</button>`:''}${can(2)?`<button class="btn sm gray" data-a="act" data-do="mute" data-uid="${p.userId}" data-n="${esc(p.name)}">Mute</button><button class="btn sm gray" data-a="act" data-do="points" data-uid="${p.userId}" data-n="${esc(p.name)}">Points</button><button class="btn sm red" data-a="act" data-do="ban" data-uid="${p.userId}" data-n="${esc(p.name)}">Ban</button>`:''}</div>`;

const PAGES={
home:()=>{
  const st=S.stats,setup=!S.connected&&!st.joins;
  return head('Home',esc(S.workspace.name))+
  (setup?`<div class="card mt" style="background:var(--tint);box-shadow:none;margin:0 0 16px"><div class="row"><div class="sp"><h3>Finish setting up</h3><span class="muted">Your game hasn't connected yet. Add the script to start moderating.</span></div><button class="btn" data-a="goto" data-id="settings" data-tab="game">Set up</button></div></div>`:'')+
  `<div class="grid gh"><div class="card hero" style="min-height:190px"><div class="stat"><span>Players online</span><b>${S.players.length}</b><span>Peak ${st.peak}</span></div>${spark(S.history.map(h=>h.n))}</div>
   <div class="grid g2"><div class="card stat"><b>${S.openCalls}</b><span>Open reports</span></div><div class="card stat"><b>${st.activeBans}</b><span>Bans</span></div><div class="card stat"><b>${st.activeMutes}</b><span>Mutes</span></div><div class="card stat"><b>${st.kicks}</b><span>Kicks</span></div></div></div>
   <div class="grid g2 mt">${can(2)?`<div class="card"><h3>Announce to all servers</h3><p class="muted" style="margin:4px 0 14px">Shows a banner to every player.</p><form data-f="announce"><input class="field" name="text" placeholder="Server restarting in 5 minutes" maxlength="200" required><div class="row" style="margin-top:12px"><span class="sp"></span><button class="btn">Send</button></div></form></div>`:''}
   <div class="card tight" style="${can(2)?'':'grid-column:1/-1'}"><div style="padding:16px 22px 6px"><h3>Recent activity</h3></div><div class="list">${S.feed.length?S.feed.slice(0,7).map(f=>`<div style="padding:10px 22px"><div class="t"><span style="color:var(--ink)">${esc(f.text)}</span></div><span class="fine">${ago(f.t)}</span></div>`).join(''):empty('Nothing yet','Activity from your game shows up here.')}</div></div></div>`},

players:()=>{
  const t=tab.players;
  let body='';
  if(t==='online')body=S.players.length?`<div class="grid g2">${S.players.map(p=>`<div class="card pc">${avatar(p.userId,p.name,'lg')}<div style="flex:1;min-width:0"><b>${esc(p.displayName&&p.displayName!==p.name?p.displayName:p.name)}</b><div class="muted" style="font-size:13px">@${esc(p.name)} · server ${esc(p.server)}</div>${pActs(p)}</div></div>`).join('')}</div>`:`<div class="card">${empty('No one is online','Players show up here while they play.')}</div>`;
  else if(t==='search')body=`<form data-f="search" class="row"><input class="field" name="q" placeholder="Roblox username" maxlength="40" required style="max-width:420px"><button class="btn">Search</button></form><div class="mt">${found?foundCard(found):''}</div>`;
  else{const li=(x,kind)=>`<div>${avatar(x.userId,x.name)}<div class="t"><b>${esc(x.name)}</b><span>${esc(x.reason||'')} · ${x.expires?'until '+new Date(x.expires).toLocaleString():'permanent'}</span></div>${can(kind==='ban'?3:2)?`<button class="btn sm gray" data-a="act" data-do="${kind==='ban'?'unban':'unmute'}" data-uid="${x.userId}" data-n="${esc(x.name)}">${kind==='ban'?'Unban':'Unmute'}</button>`:''}</div>`;
    body=`<h3 style="margin:0 0 10px 4px">Banned</h3><div class="card tight list">${S.bans.length?S.bans.map(x=>li(x,'ban')).join(''):empty('No active bans')}</div><h3 style="margin:24px 0 10px 4px">Muted</h3><div class="card tight list">${S.mutes.length?S.mutes.map(x=>li(x,'mute')).join(''):empty('No active mutes')}</div>`}
  return head('Players','Who is playing, and who is not allowed to.',seg('players',[['online','Online ('+S.players.length+')'],['search','Search'],['banned','Banned & muted']]))+body},

reports:()=>{
  const t=tab.reports;let body='';
  if(t==='calls')body=S.calls.length?S.calls.map(c=>`<div class="card mt" style="margin-top:0;margin-bottom:14px"><div class="row"><b>Report #${c.id}</b><span class="pill ${c.status}">${c.status}</span><span class="sp"></span><span class="fine">${ago(c.t)} · server ${esc(c.server)}</span></div>
     <p style="margin:10px 0 4px"><b>${esc(c.from.name)}</b> says: ${esc(c.text)}</p>${c.by?`<div class="fine">Handled by ${esc(c.by)}</div>`:''}${c.note?`<div class="fine">Note: ${esc(c.note)}</div>`:''}
     ${c.chat.length?`<div class="callchat"><div class="fine" style="margin-bottom:4px">Chat around that moment</div>${c.chat.map(m=>`<div class="${m.flagged?'hl':''}"><b>${esc(m.name)}</b> ${esc(m.text)}</div>`).join('')}</div>`:''}
     <div class="acts row" style="margin-top:14px;gap:8px"><button class="btn sm gray" data-a="act" data-do="warn" data-uid="${c.from.userId}" data-n="${esc(c.from.name)}">Warn reporter</button>${c.status==='open'?`<button class="btn sm" data-a="call" data-op="claim" data-id="${c.id}">Claim</button>`:''}${c.status!=='resolved'?`<button class="btn sm" data-a="call" data-op="resolve" data-id="${c.id}">Resolve</button>`:''}</div></div>`).join(''):`<div class="card">${empty('No reports','When a player types <code>!modcall</code> in chat, it appears here.')}</div>`;
  else body=`<div class="card tight chat">${S.chat.length?S.chat.map(m=>`<div class="ln ${m.flagged?'fl':''}"><span class="fine" style="min-width:56px">${ago(m.t)}</span><span><b>${esc(m.name)}</b> ${esc(m.text)}</span>${can(1)?`<span class="a"><button class="btn sm gray" data-a="act" data-do="warn" data-uid="${m.userId}" data-n="${esc(m.name)}">Warn</button>${can(2)?`<button class="btn sm gray" data-a="act" data-do="mute" data-uid="${m.userId}" data-n="${esc(m.name)}">Mute</button>`:''}</span>`:''}</div>`).join(''):empty('No chat yet','Messages from your game appear here as they are sent.')}</div>`;
  return head('Reports','Player reports and the live chat.',seg('reports',[['calls','Reports'+(S.openCalls?' ('+S.openCalls+')':'')],['chat','Live chat']]))+body},

activity:()=>{
  const t=tab.activity;let body='';
  if(t==='sessions'){const s=S.session;
    body=s?`<div class="card"><div class="row"><span class="pill ok">Running</span><h2>${esc(s.type)}</h2><span class="sp"></span><span class="muted">${dur((Date.now()-s.start)/1000)} · ${s.attendees.length} present</span></div>${s.notes?`<p class="muted" style="margin:8px 0 0">${esc(s.notes)}</p>`:''}
      <div class="chips" style="margin:14px 0">${s.attendees.length?s.attendees.map(a=>`<span class="chip">${esc(a.name)}</span>`).join(''):'<span class="muted">Players type <code>!attend</code> to be marked present.</span>'}</div>
      <div class="row"><button class="btn gray" data-a="sess" data-op="addall">Add everyone in game</button><button class="btn red" data-a="sess" data-op="end">End session</button></div></div>`
    :`<div class="card"><h3>Start a session</h3><p class="muted" style="margin:4px 0 14px">Announces it in game. Players type <code>!attend</code> to check in.</p><form data-f="sess-start" class="row wrapf"><select class="field" name="type" style="max-width:180px"><option>Training</option><option>Shift</option><option>Event</option><option>Meeting</option></select><input class="field" name="notes" placeholder="Notes (optional)" maxlength="200" style="flex:1;min-width:160px"><button class="btn">Start</button></form></div>`;
    body+=`<h3 style="margin:26px 0 10px 4px">Past sessions</h3><div class="card tight list">${S.sessions.length?S.sessions.map(x=>`<div><div class="t"><b>${esc(x.type)}</b><span>${new Date(x.start).toLocaleString()} · ${dur((x.end-x.start)/1000)}</span></div><span class="pill blue">${x.attendees.length} attended</span></div>`).join(''):empty('No sessions yet')}</div>`}
  else{const q=S.settings.quotaMinutes*60;
    body=`<div class="card tight">${S.board.length?`<table><tr><th>#</th><th>Player</th><th>This week</th><th>Points</th>${can(2)?'<th></th>':''}</tr>${S.board.map((b,i)=>`<tr><td class="muted">${i+1}</td><td><div class="row">${avatar(b.userId,b.name)}<b>${esc(b.name)}</b></div></td><td style="min-width:150px"><div class="fine">${dur(b.week)} of ${dur(q)}</div><div class="bar ${b.week>=q?'done':''}"><i style="width:${Math.min(100,b.week/q*100)}%"></i></div></td><td><b>${b.points}</b></td>${can(2)?`<td><button class="btn sm gray" data-a="act" data-do="points" data-uid="${b.userId}" data-n="${esc(b.name)}">Points</button></td>`:''}</tr>`).join('')}</table>`:empty('No activity yet','Playtime is tracked automatically while people play.')}</div>`}
  return head('Activity','Sessions, playtime and points.',seg('activity',[['sessions','Sessions'],['board','Leaderboard']]))+body},

settings:()=>{
  const tabs=[['game','Game',3],['team','Team',3],['auto','Automations',3],['mod','Moderation',2],['ws','Workspace',1]].filter(x=>can(x[2]));
  if(!tabs.some(x=>x[0]===tab.settings))tab.settings=tabs[0][0];
  return head('Settings','',seg('settings',tabs.map(x=>[x[0],x[1]])))+SET[tab.settings]()}
};

  return `<div class="card"><div class="row"><div class="status ${S.connected?'ok':''}" style="width:48px;height:48px;margin:0">${S.connected?`<svg class="i" viewBox="0 0 24 24" style="width:22px;height:22px">${IC.check}</svg>`:'<div class="spin" style="width:20px;height:20px;border-width:3px"></div>'}</div>

  <div class="grid g2 mt"><div class="card"><h3>Install the script</h3><p class="muted" style="margin:6px 0 14px">Put it in a Script inside <b>ServerScriptService</b>, then turn on <b>Allow HTTP Requests</b> in Game Settings, Security.</p><div class="row wrapf"><button class="btn" data-a="copy-script">Copy script</button><a class="btn gray" href="/api/bridge?download=1">Download .lua</a></div></div>

   <div class="row" style="margin-top:12px"><button class="btn plain" style="padding:0" data-a="key-rotate">Make a new key…</button></div></div></div>
  <div class="card mt"><h3>In-game commands</h3><div class="list" style="margin:8px -22px -6px"><div><div class="t"><b><code>!modcall</code> your message</b><span>Players report a problem to your moderators</span></div></div><div><div class="t"><b><code>!attend</code></b><span>Players check in to a running session</span></div></div></div></div>`},

team:()=>`<div class="card tight"><div style="padding:16px 22px 6px"><h3>Team (${S.team.length})</h3></div><div class="list">${S.team.map(m=>`<div>${avatar('',m.name)}<div class="t"><b>${esc(m.name)}</b><span>Signed in with ${m.via}${m.owner?' · Owner':''}</span></div>${m.owner||m.uid===S.me.uid?`<span class="pill">${m.owner?'Owner':m.role}</span>`:`<select class="field" style="width:130px;height:34px" data-a="role" data-uid="${m.uid}">${['helper','moderator','admin'].map(r=>`<option value="${r}"${r===m.role?' selected':''}>${r[0].toUpperCase()+r.slice(1)}</option>`).join('')}</select><button class="btn sm gray" data-a="remove" data-uid="${m.uid}" data-n="${esc(m.name)}">Remove</button>`}</div>`).join('')}</div></div>
  <div class="card mt"><h3>Invite someone</h3><p class="muted" style="margin:4px 0 14px">They'll sign in with Google or Roblox and join your workspace. Each link works once and expires in 7 days.</p>
   <form data-f="invite" class="row wrapf"><select class="field" name="role" style="max-width:200px"><option value="helper">Helper (warn, kick, reports)</option><option value="moderator">Moderator (+ mute, bans, points)</option><option value="admin">Admin (everything)</option></select><button class="btn">Create invite link</button></form>
   ${S.invites.length?`<div class="list" style="margin:16px -22px -6px">${S.invites.map(i=>`<div><div class="t"><b class="key" style="font-size:12.5px;word-break:break-all">${location.origin}/#/join/${i.code}</b><span>${i.role} · expires ${new Date(i.exp).toLocaleDateString()}</span></div><button class="btn sm" data-a="invite-copy" data-code="${i.code}">Copy</button><button class="btn sm gray" data-a="invite-revoke" data-code="${i.code}">Revoke</button></div>`).join('')}</div>`:''}</div>`,

auto:()=>{
  const R={autosuspend:['Auto-suspend','Suspend someone after repeated warnings.',[['warns','warnings in a row'],['minutes','minute suspension']]],sessionpoints:['Session points','Give points to everyone who attends a session.',[['points','points each']]],
    flaggedmute:['Auto-mute','Mute people who keep sending flagged words.',[['count','flagged messages'],['minutes','minute mute']]],welcome:['Welcome message','Show a message to every player who joins.',[['text','Message',1]]]};
  return `<div class="card tight list">${Object.entries(R).map(([id,[t,d,f]])=>{const r=S.rules[id];return `<div style="align-items:flex-start;flex-wrap:wrap"><div class="t" style="min-width:220px"><b>${t}</b><span>${d}</span>
   <div class="row wrapf" style="margin-top:10px">${f.map(([k,l,txt])=>txt?`<input class="field" data-a="rule-param" data-id="${id}" data-k="${k}" value="${esc(r[k])}" maxlength="120" style="max-width:360px" aria-label="${l}">`:`<input class="field" type="number" min="1" data-a="rule-param" data-id="${id}" data-k="${k}" value="${r[k]}" style="width:84px;height:34px" aria-label="${l}"><span class="muted" style="margin-right:6px">${l}</span>`).join('')}</div></div>
   <button class="sw ${r.enabled?'on':''}" role="switch" aria-checked="${r.enabled}" aria-label="${t}" data-a="rule-toggle" data-id="${id}"></button></div>`}).join('')}</div>`},

mod:()=>`<div class="card"><h3>Flagged words</h3><p class="muted" style="margin:4px 0 14px">Messages containing these are highlighted in Reports. Separate with commas.</p><form data-f="words"><textarea class="field" name="w">${esc(S.flagWords.join(', '))}</textarea><div class="row" style="margin-top:12px"><span class="sp"></span><button class="btn">Save words</button></div></form></div>
  ${can(3)?`<div class="card mt"><h3>Weekly playtime goal</h3><p class="muted" style="margin:4px 0 14px">Shown as a progress bar on the leaderboard.</p><form data-f="quota" class="row"><input class="field" type="number" min="1" name="m" value="${S.settings.quotaMinutes}" style="width:110px"><span class="muted">minutes per week</span><span class="sp"></span><button class="btn">Save</button></form></div>`:''}`,

ws:()=>`${can(3)?`<div class="card"><h3>Workspace name</h3><form data-f="rename" class="row" style="margin-top:12px"><input class="field" name="name" value="${esc(S.workspace.name)}" maxlength="40" required><button class="btn">Save</button></form></div>`:''}
  <div class="card mt tight"><div class="list"><div><div class="t"><b>Privacy Policy</b></div><a href="/legal/privacy" target="_blank">View</a></div><div><div class="t"><b>Terms of Service</b></div><a href="/legal/terms" target="_blank">View</a></div><div><div class="t"><b>Cookie Policy</b></div><a href="/legal/cookies" target="_blank">View</a></div><div><div class="t"><b>Player Notice</b><span>Show this to players in your game</span></div><a href="/legal/player-notice" target="_blank">View</a></div></div></div>
  ${can(2)&&S.audit.length?`<div class="card mt tight"><div style="padding:16px 22px 6px"><h3>Recent changes</h3></div><div class="list">${S.audit.slice(0,12).map(a=>`<div style="padding:9px 22px"><div class="t"><span style="color:var(--ink)"><b>${esc(a.user)}</b> ${esc(a.text)}</span></div><span class="fine">${ago(a.t)}</span></div>`).join('')}</div></div>`:''}
  <div class="card mt"><h3>${S.me.owner?'Delete workspace':'Leave workspace'}</h3><p class="muted" style="margin:4px 0 14px">${S.me.owner?'Permanently erases this workspace and everything in it: players, logs, reports and team. This cannot be undone.':'You will lose access to this workspace until someone invites you again.'}</p><button class="btn red" data-a="${S.me.owner?'ws-delete':'ws-leave'}">${S.me.owner?'Delete workspace…':'Leave workspace…'}</button></div>`
};

function foundCard(f){
  const p=f.play;
  return `<div class="card"><div class="pc">${avatar(f.userId,f.name,'xl')}<div style="flex:1;min-width:0"><h2>${esc(f.displayName||f.name)}</h2><div class="muted">@${esc(f.name)} · ID ${f.userId}${f.created?' · joined Roblox '+new Date(f.created).getFullYear():''}</div>
   <div class="row wrapf" style="margin-top:8px;gap:6px">${f.online?'<span class="pill ok">Online</span>':'<span class="pill">Offline</span>'}${f.banned?'<span class="pill open">Banned</span>':''}${f.muted?'<span class="pill claimed">Muted</span>':''}${p?`<span class="pill blue">${dur(p.total)} played</span><span class="pill blue">${p.points} points</span>`:''}</div>${pActs(f)}
   ${can(3)?`<div class="row" style="margin-top:12px;gap:8px"><a class="btn sm gray" href="/api/export?userId=${f.userId}">Export their data</a><button class="btn sm gray" data-a="erase" data-uid="${f.userId}" data-n="${esc(f.name)}">Erase their data</button></div>`:''}</div></div>
   ${f.logbook.length?`<h3 style="margin:20px 0 8px 4px">Logbook</h3><div class="card tight list">${[...f.logbook].reverse().slice(0,25).map(e=>`<div><span class="pill">${esc(e.type)}</span><div class="t"><b>${esc(e.reason||'')}</b><span>by ${esc(e.by||'?')} · ${new Date(e.time).toLocaleString()}</span></div></div>`).join('')}</div>`:''}</div>`}

/* ---------- actions ---------- */
const done=async(r,msg)=>{if(fail(r))return false;toast(msg);await refresh();return true};
async function doAct(a,p){
  const L={warn:'Warn',kick:'Kick',mute:'Mute',ban:'Ban',unban:'Unban',unmute:'Unmute',points:'Give points to'};
  if(a==='unban'||a==='unmute')return done(await api('/api/action',{action:a,userId:p.userId,name:p.name,reason:'Lifted'}),L[a]+' done');
  const fields=a==='points'?[{name:'amount',label:'Points (use a minus to remove)',type:'number',value:5,required:1},{name:'reason',label:'Reason',value:'',required:1}]:
   [{name:'reason',label:'Reason',placeholder:'What happened?',required:1},...(a==='mute'||a==='ban'?[{name:'minutes',label:a==='ban'&&can(3)?'Minutes (0 = permanent)':'Minutes',type:'number',value:a==='mute'?10:(can(3)?0:60),help:a==='ban'&&!can(3)?'Moderators can suspend for a set time. Admins can ban permanently.':''}]:[])];
  const v=await sheet({title:`${L[a]} ${p.name}`,fields,ok:a==='points'?'Give points':L[a],danger:a==='ban'||a==='kick'});if(!v)return;
  let minutes=+v.minutes||0;if(a==='ban'&&!can(3)&&minutes<1)minutes=60;
  return done(await api('/api/action',{action:a,userId:p.userId,name:p.name,reason:v.reason,minutes,amount:+v.amount||0}),a==='points'?'Points updated':L[a]+' sent');
}
const ensureSetup=async()=>{if(!SETUP&&can(3)){const r=await api('/api/setup');if(!r.error){SETUP=r;render()}}};
async function copyScript(){try{const t=await (await fetch('/api/bridge')).text();await navigator.clipboard.writeText(t);toast('Script copied')}catch{toast('Could not copy. Use Download instead.','err')}}
async function startOnboardingStep(n){OB.step=n;if(n===2||n===3){SETUP=SETUP||await api('/api/setup')}render();if(n===3)pollOB()}
let obTimer=null;
async function pollOB(){clearTimeout(obTimer);if(!OB||OB.step!==3)return;const r=await api('/api/state');if(r&&r.connected&&!OB.ok){OB.ok=true;render()}if(OB&&OB.step===3&&!OB.ok)obTimer=setTimeout(pollOB,3000)}

document.addEventListener('click',async e=>{
  const el=e.target.closest('[data-a]');
  if(menuOpen&&!(el&&el.dataset.a==='wsmenu')&&!e.target.closest('.menu')){menuOpen=false;if(!el||el.dataset.a==='nav'){render()}}
  if(!el)return;const a=el.dataset.a,d=el.dataset,p=()=>({userId:+d.uid,name:d.n});
  if(a==='nav'){page=d.id;menuOpen=false;if(page==='settings')ensureSetup();render()}
  else if(a==='goto'){page=d.id;if(d.tab)tab[d.id]=d.tab;if(page==='settings')ensureSetup();render()}
  else if(a==='tab'){tab[d.k]=d.id;render();if(d.k==='settings'&&d.id==='game')ensureSetup()}
  else if(a==='wsmenu'){menuOpen=!menuOpen;render()}
  else if(a==='ws-switch'){menuOpen=false;SETUP=null;const r=await api('/api/switch',{id:d.id});if(!fail(r)){found=null;page='home';await refresh()}}
  else if(a==='ws-new'){menuOpen=false;OB={step:1,extra:1};render()}
  else if(a==='ob-cancel'){OB=null;render()}
  else if(a==='ob-next')startOnboardingStep(3);
  else if(a==='ob-done'){clearTimeout(obTimer);OB=null;SETUP=null;page='home';await loadMe();await refresh()}
  else if(a==='signout'){await api('/logout',{});ME=await api('/api/me');S=null;SETUP=null;OB=null;menuOpen=false;render()}
  else if(a==='copy-script')copyScript();
  else if(a==='key-show'){const i=$('#gk');i.type=i.type==='password'?'text':'password';el.textContent=i.type==='password'?'Show':'Hide'}
  else if(a==='key-copy'){try{await navigator.clipboard.writeText(SETUP.gameKey);toast('Key copied')}catch{toast('Could not copy','err')}}
  else if(a==='key-rotate'){const v=await sheet({title:'Make a new game key?',text:'Your current key stops working immediately. You will need to download and paste the script into your game again.',ok:'Make new key',danger:true});if(v){const r=await api('/api/workspace',{op:'rotatekey'});if(!fail(r)){SETUP=null;toast('New key created. Download the script again.');await ensureSetup();await refresh()}}}
  else if(a==='act')doAct(d.do,p());
  else if(a==='erase'){const v=await sheet({title:'Erase '+d.n+'\'s data?',text:'Removes their logbook, playtime, points and reports. An active ban is kept so they can\'t come back. This cannot be undone.',ok:'Erase',danger:true});if(v)done(await api('/api/erase',{userId:+d.uid}),'Data erased').then(()=>{found=null;render()})}
  else if(a==='call'){let note='';if(d.op==='resolve'){const v=await sheet({title:'Resolve report #'+d.id,fields:[{name:'note',label:'Note for the player (optional)',placeholder:'Handled, thanks!'}],ok:'Resolve'});if(!v)return;note=v.note}done(await api('/api/call',{id:+d.id,op:d.op,note}),d.op==='claim'?'Report claimed':'Report resolved')}
  else if(a==='sess')done(await api('/api/session',{op:d.op}),d.op==='end'?'Session ended':'Added');
  else if(a==='rule-toggle'){const r=S.rules[d.id];done(await api('/api/rules',{id:d.id,enabled:!r.enabled,params:r}),'Saved')}
  else if(a==='invite-copy'){try{await navigator.clipboard.writeText(location.origin+'/#/join/'+d.code);toast('Invite link copied')}catch{toast('Could not copy','err')}}
  else if(a==='invite-revoke')done(await api('/api/team',{op:'revoke',code:d.code}),'Invite revoked');
  else if(a==='remove'){const v=await sheet({title:'Remove '+d.n+'?',text:'They lose access to this workspace immediately.',ok:'Remove',danger:true});if(v)done(await api('/api/team',{op:'remove',uid:d.uid}),'Removed')}
  else if(a==='ws-leave'){const v=await sheet({title:'Leave this workspace?',ok:'Leave',danger:true});if(v){const r=await api('/api/team',{op:'leave'});if(!fail(r)){S=null;SETUP=null;await loadMe();await refresh()}}}
  else if(a==='ws-delete'){const v=await sheet({title:'Delete '+S.workspace.name+'?',text:'This permanently erases everything in this workspace for everyone.',fields:[{name:'confirm',label:'Type the workspace name to confirm',placeholder:S.workspace.name,required:1}],ok:'Delete forever',danger:true});if(v){const r=await api('/api/workspace',{op:'delete',confirm:v.confirm});if(!fail(r)){S=null;SETUP=null;page='home';await loadMe();toast('Workspace deleted');await refresh()}}}
  else if(a==='join-accept'){const r=await api('/api/join',{code:JOIN.code});if(!fail(r)){JOIN=null;history.replaceState(null,'',location.pathname);SETUP=null;await loadMe();await refresh()}}
  else if(a==='join-cancel'){JOIN=null;history.replaceState(null,'',location.pathname);render()}
});
document.addEventListener('change',async e=>{
  const el=e.target.closest('[data-a]');if(!el)return;
  if(el.dataset.a==='role')done(await api('/api/team',{op:'setrole',uid:el.dataset.uid,role:el.value}),'Role updated');
  else if(el.dataset.a==='rule-param'){const id=el.dataset.id,r={...S.rules[id]};r[el.dataset.k]=el.type==='number'?+el.value:el.value;const x=await api('/api/rules',{id,enabled:r.enabled,params:r});if(!fail(x)){toast('Saved');await loadState()}}
});
document.addEventListener('submit',async e=>{
  const f=e.target.closest('[data-f]');if(!f)return;e.preventDefault();const k=f.dataset.f,v=Object.fromEntries(new FormData(f));
  if(k==='ob-name'){const b=f.querySelector('button');b.disabled=true;const r=await api('/api/workspaces',{name:v.name});b.disabled=false;if(fail(r))return;OB.name=v.name;SETUP=null;await loadMe();await startOnboardingStep(2)}
  else if(k==='announce')done(await api('/api/action',{action:'announce',reason:v.text}),'Announcement sent');
  else if(k==='search'){const r=await api('/api/lookup?name='+encodeURIComponent(v.q.trim()));if(r._s===404){found=null;toast('No player with that username','err')}else if(!fail(r))found=r;render()}
  else if(k==='sess-start')done(await api('/api/session',{op:'start',type:v.type,notes:v.notes}),'Session started');
  else if(k==='words')done(await api('/api/flagwords',{words:v.w.split(',')}),'Words saved');
  else if(k==='quota')done(await api('/api/settings',{quotaMinutes:+v.m}),'Saved');
  else if(k==='rename')done(await api('/api/workspace',{op:'rename',name:v.name}),'Renamed').then(()=>loadMe());
  else if(k==='invite'){const r=await api('/api/team',{op:'invite',role:v.role});if(!fail(r)){try{await navigator.clipboard.writeText(r.link);toast('Invite link copied')}catch{toast('Invite created')}await refresh()}}
});

/* ---------- start ---------- */
async function poll(){
  if(document.hidden||!ME||!ME.user||!S||OB||JOIN||sheetOpen()||menuOpen)return;
  const ae=document.activeElement;if(ae&&/^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName))return;
  await loadState();if(S)render()}
(async function boot(){
  render();
  const m=/^#\/join\/([a-f0-9]{28})$/.exec(location.hash);if(m)JOIN={code:m[1]};
  await loadMe();
  if(JOIN){const pv=await api('/api/invite?code='+JOIN.code);if(pv._s===200)JOIN.info=pv;else JOIN.err=pv.error}
  if(ME.user&&ME.workspaces.length)await loadState();
  render();setInterval(poll,6000)})();
</script>
</body>
</html>
